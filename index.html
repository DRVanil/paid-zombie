<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>PAID ZOMBIE</title>

<style>
:root{
  --bg:#070910;
  --bg2:#0d1020;
  --panel:rgba(19,23,39,.72);
  --panel2:rgba(26,31,52,.82);
  --line:rgba(255,255,255,.09);
  --text:#f5f7ff;
  --muted:#8d95ac;
  --cyan:#42e8ff;
  --blue:#5c7cff;
  --violet:#a66cff;
  --pink:#ff55c8;
  --green:#59f0a3;
  --yellow:#ffd76a;
  --danger:#ff637d;
  --shadow:0 20px 70px rgba(0,0,0,.42);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(92,124,255,.13),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(255,85,200,.10),transparent 28%),
    radial-gradient(circle at 50% 90%,rgba(66,232,255,.07),transparent 35%),
    #070910;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  position:relative;
  padding-bottom:105px;
}

.screen{
  display:none;
  min-height:100vh;
  padding:
    calc(15px + env(safe-area-inset-top))
    16px
    25px;
  animation:screenIn .28s ease;
}

.screen.active{
  display:block;
}

@keyframes screenIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* ---------- COMMON ---------- */

.glass{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.075),
    rgba(255,255,255,.025)
  );
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));
  -webkit-background-clip:text;
  color:transparent;
}

.icon-btn{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
}

.icon-btn svg{
  width:21px;
  height:21px;
}

.page-title{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1px;
  margin:3px 0 5px;
}

.page-subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:18px;
  font-weight:850;
  margin:25px 0 12px;
}

.muted{
  color:var(--muted);
}

.card{
  border-radius:24px;
  padding:17px;
}

.btn{
  min-height:48px;
  border-radius:16px;
  padding:0 18px;
  font-weight:850;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  box-shadow:0 10px 35px rgba(92,124,255,.22);
}

.btn:active{
  transform:scale(.97);
}

.btn.secondary{
  background:rgba(255,255,255,.065);
  box-shadow:none;
  border:1px solid var(--line);
}

.btn.green{
  background:linear-gradient(135deg,#35d98a,#4ce9c2);
  color:#06120e;
}

.btn.pink{
  background:linear-gradient(135deg,var(--pink),var(--violet));
}

.btn.full{
  width:100%;
}

.btn:disabled{
  opacity:.4;
  pointer-events:none;
}

.stat-value{
  font-size:23px;
  font-weight:900;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

/* ---------- HOME ---------- */

.home-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.user-box{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:47px;
  height:47px;
  border-radius:16px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:
    linear-gradient(135deg,rgba(66,232,255,.18),rgba(166,108,255,.18));
  border:1px solid rgba(255,255,255,.1);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-name{
  font-size:16px;
  font-weight:850;
  max-width:170px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-level{
  color:var(--muted);
  font-size:11px;
}

.balance-box{
  text-align:right;
}

.balance-zmb{
  font-size:20px;
  font-weight:900;
}

.balance-ton{
  color:#61a9ff;
  font-size:13px;
  font-weight:750;
  margin-top:2px;
}

/* HERO */

.hero{
  height:310px;
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden;
  margin:2px -4px 4px;
}

.hero::before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(66,232,255,.22),
      rgba(92,124,255,.13) 32%,
      rgba(166,108,255,.10) 52%,
      transparent 72%);
  filter:blur(18px);
  animation:heroGlow 4s ease-in-out infinite alternate;
}

@keyframes heroGlow{
  from{transform:scale(.88);opacity:.7}
  to{transform:scale(1.15);opacity:1}
}

.orb{
  width:205px;
  height:205px;
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 25%,
      rgba(255,255,255,.95) 0 2%,
      rgba(122,246,255,.9) 5%,
      transparent 16%),
    radial-gradient(circle at 65% 70%,
      rgba(255,75,205,.65),
      transparent 35%),
    radial-gradient(circle at 38% 55%,
      rgba(82,132,255,.9),
      transparent 45%),
    radial-gradient(circle at 50% 50%,
      #101d50,
      #0c1128 65%,
      #080a14);
  box-shadow:
    0 0 35px rgba(66,232,255,.22),
    0 0 90px rgba(166,108,255,.18),
    inset -20px -20px 55px rgba(0,0,0,.5),
    inset 12px 10px 30px rgba(255,255,255,.12);
  animation:orbFloat 5s ease-in-out infinite;
}

@keyframes orbFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-9px) rotate(3deg)}
}

.orb::before,
.orb::after{
  content:"";
  position:absolute;
  inset:-17px;
  border-radius:50%;
  border:1px solid rgba(100,222,255,.24);
  transform:rotate(25deg) scaleX(1.55);
  animation:ringSpin 9s linear infinite;
}

.orb::after{
  inset:-28px;
  border-color:rgba(255,91,210,.18);
  transform:rotate(-32deg) scaleX(1.5);
  animation-direction:reverse;
  animation-duration:13s;
}

@keyframes ringSpin{
  to{transform:rotate(385deg) scaleX(1.55)}
}

.liquid{
  position:absolute;
  border-radius:50%;
  filter:blur(3px);
  mix-blend-mode:screen;
}

.liquid.one{
  width:110px;
  height:75px;
  left:25px;
  top:67px;
  background:rgba(64,225,255,.35);
  animation:liquid1 5s ease-in-out infinite;
}

.liquid.two{
  width:95px;
  height:120px;
  right:22px;
  top:35px;
  background:rgba(177,93,255,.32);
  animation:liquid2 6s ease-in-out infinite;
}

.liquid.three{
  width:100px;
  height:80px;
  left:55px;
  bottom:22px;
  background:rgba(255,69,196,.28);
  animation:liquid3 7s ease-in-out infinite;
}

@keyframes liquid1{
  50%{transform:translate(24px,-13px) scale(1.15)}
}

@keyframes liquid2{
  50%{transform:translate(-20px,18px) scale(.82)}
}

@keyframes liquid3{
  50%{transform:translate(15px,-15px) scale(1.18)}
}

.orb-core{
  position:absolute;
  inset:31%;
  border-radius:50%;
  background:radial-gradient(circle,#eaffff,#6ae9ff 18%,#587dff 43%,transparent 72%);
  filter:blur(5px);
  animation:corePulse 2.3s ease-in-out infinite;
}

@keyframes corePulse{
  50%{transform:scale(1.2);opacity:.7}
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #8cefff;
  animation:particleFloat 4s ease-in-out infinite;
}

.p1{left:18%;top:31%}
.p2{right:17%;top:27%;animation-delay:1s}
.p3{left:22%;bottom:22%;animation-delay:2s}
.p4{right:25%;bottom:29%;animation-delay:.6s}

@keyframes particleFloat{
  50%{transform:translateY(-20px) scale(1.6);opacity:.4}
}

/* HOME BUTTONS */

.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.home-action{
  height:108px;
  border-radius:23px;
  padding:16px;
  text-align:left;
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.035)
  );
  border:1px solid rgba(255,255,255,.08);
}

.home-action::after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  right:-35px;
  bottom:-40px;
  background:var(--accent);
  opacity:.13;
  filter:blur(15px);
}

.home-action svg{
  width:27px;
  height:27px;
  margin-bottom:12px;
}

.home-action strong{
  display:block;
  font-size:16px;
}

.home-action small{
  color:var(--muted);
  font-size:11px;
}

.a-mining{--accent:var(--cyan)}
.a-games{--accent:var(--pink)}
.a-earn{--accent:var(--green)}
.a-give{--accent:var(--yellow)}

.level-card{
  margin-top:13px;
  border-radius:20px;
  padding:15px;
}

.level-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  font-size:12px;
}

.progress{
  height:8px;
  border-radius:99px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--cyan),var(--blue),var(--pink));
  box-shadow:0 0 16px rgba(92,124,255,.6);
}

/* PAYOUT FEED */

.feed{
  margin-top:13px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.payout{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  border-radius:16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
  animation:feedIn .35s ease;
}

@keyframes feedIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

.payout-icon{
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:rgba(89,240,163,.1);
  color:var(--green);
}

.payout-main{
  flex:1;
}

.payout-user{
  font-size:12px;
  font-weight:750;
}

.payout-time{
  color:var(--muted);
  font-size:10px;
}

.payout-value{
  color:var(--green);
  font-size:12px;
  font-weight:850;
}

/* ---------- MINING ---------- */

.mining-card{
  border-radius:28px;
  padding:23px;
  text-align:center;
  margin-bottom:13px;
  position:relative;
  overflow:hidden;
}

.mining-card::before{
  content:"";
  position:absolute;
  width:200px;
  height:200px;
  left:50%;
  top:-130px;
  transform:translateX(-50%);
  background:var(--cyan);
  filter:blur(80px);
  opacity:.12;
}

.mining-number{
  font-size:34px;
  font-weight:950;
  letter-spacing:-1px;
  margin:15px 0 5px;
}

.mining-unit{
  color:var(--muted);
  font-size:12px;
}

.mining-status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:12px;
  padding:7px 11px;
  border-radius:99px;
  background:rgba(255,255,255,.055);
  color:var(--muted);
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--danger);
}

.dot.on{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.mining-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:20px;
}

.mining-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.tab{
  height:45px;
  border-radius:14px;
  background:rgba(255,255,255,.045);
  color:var(--muted);
  border:1px solid transparent;
  font-weight:800;
}

.tab.active{
  color:white;
  background:rgba(92,124,255,.14);
  border-color:rgba(92,124,255,.3);
}

.shop-grid{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.miner{
  padding:15px;
  border-radius:21px;
  display:flex;
  gap:13px;
  align-items:center;
}

.miner-art{
  width:54px;
  height:54px;
  border-radius:17px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,rgba(66,232,255,.12),rgba(166,108,255,.12));
  color:var(--cyan);
}

.miner-info{
  flex:1;
}

.miner-name{
  font-size:15px;
  font-weight:850;
}

.miner-desc{
  font-size:11px;
  color:var(--muted);
  margin:3px 0 6px;
}

.miner-profit{
  color:var(--green);
  font-size:11px;
  font-weight:800;
}

.miner-buy{
  min-width:84px;
  padding:9px 8px;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  font-size:11px;
  font-weight:850;
}

/* BOOSTS */

.boost-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.boost{
  min-height:155px;
  padding:15px;
  border-radius:21px;
  position:relative;
}

.boost-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(166,108,255,.12);
  color:var(--violet);
  margin-bottom:10px;
}

.boost-name{
  font-weight:850;
  font-size:14px;
}

.boost-desc{
  font-size:10px;
  color:var(--muted);
  line-height:1.4;
  margin:5px 0 11px;
}

.boost button{
  width:100%;
  height:34px;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  font-size:10px;
  font-weight:850;
}

/* ---------- GAMES ---------- */

.game-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.game-card{
  height:145px;
  border-radius:26px;
  padding:18px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:flex-end;
}

.game-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 80% 30%,rgba(255,82,190,.25),transparent 32%),
    linear-gradient(135deg,rgba(90,110,255,.16),rgba(255,255,255,.025));
}

.game-card.run::before{
  background:
    radial-gradient(circle at 80% 30%,rgba(82,255,175,.2),transparent 32%),
    linear-gradient(135deg,rgba(70,130,255,.15),rgba(255,255,255,.025));
}

.game-card-content{
  position:relative;
  z-index:2;
}

.game-card h3{
  margin:0 0 4px;
  font-size:20px;
}

.game-card p{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

.game-card .play{
  position:absolute;
  right:17px;
  bottom:17px;
  z-index:3;
  width:45px;
  height:45px;
  border-radius:15px;
  background:rgba(255,255,255,.1);
  display:grid;
  place-items:center;
  backdrop-filter:blur(12px);
}

.game-mini-zombie{
  position:absolute;
  right:80px;
  top:27px;
  width:60px;
  height:76px;
  z-index:2;
  animation:miniZombie 1.4s ease-in-out infinite;
}

@keyframes miniZombie{
  50%{transform:translateY(-8px) rotate(2deg)}
}

/* ---------- FULL GAME MODAL ---------- */

.game-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:#05070d;
}

.game-modal.active{
  display:flex;
  flex-direction:column;
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0}
  to{opacity:1}
}

.game-header{
  height:64px;
  padding:
    calc(7px + env(safe-area-inset-top))
    14px
    7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(7,9,16,.72);
  backdrop-filter:blur(18px);
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:5;
}

.game-score{
  font-weight:900;
  font-size:14px;
}

.game-earned{
  color:var(--green);
  font-size:11px;
  margin-top:2px;
}

.game-close{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  display:grid;
  place-items:center;
}

.game-canvas-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.game-hint{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  transition:.3s;
}

.game-hint.hidden{
  opacity:0;
}

.game-hint-title{
  font-size:28px;
  font-weight:950;
  text-shadow:0 5px 30px #000;
}

.game-hint-sub{
  margin-top:7px;
  color:rgba(255,255,255,.65);
  font-size:12px;
}

.game-over{
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(4,6,12,.48);
  backdrop-filter:blur(5px);
  z-index:4;
}

.game-over.active{
  display:grid;
}

.game-over-box{
  width:min(330px,88%);
  padding:25px;
  text-align:center;
  border-radius:26px;
}

.game-over-title{
  font-size:28px;
  font-weight:950;
  margin-bottom:10px;
}

.game-result{
  color:var(--muted);
  margin-bottom:18px;
}

/* ---------- WHEEL ---------- */

.modal{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(2,4,9,.72);
  backdrop-filter:blur(13px);
}

.modal.active{
  display:flex;
}

.modal-box{
  width:min(470px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:28px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{
  font-size:22px;
  font-weight:900;
}

.close{
  width:38px;
  height:38px;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  display:grid;
  place-items:center;
}

.wheel-wrap{
  display:grid;
  place-items:center;
  margin:5px 0 20px;
}

.wheel{
  width:260px;
  height:260px;
  border-radius:50%;
  position:relative;
  border:8px solid rgba(255,255,255,.08);
  box-shadow:
    0 0 60px rgba(166,108,255,.18),
    inset 0 0 25px rgba(0,0,0,.4);
  background:conic-gradient(
    #44e6ff 0deg 45deg,
    #766aff 45deg 90deg,
    #ff58c9 90deg 135deg,
    #56e7a0 135deg 180deg,
    #ffd56c 180deg 225deg,
    #54a4ff 225deg 270deg,
    #b46aff 270deg 315deg,
    #45e3df 315deg 360deg
  );
  transition:transform 4s cubic-bezier(.12,.72,.1,1);
}

.wheel::after{
  content:"";
  position:absolute;
  width:56px;
  height:56px;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#101423;
  border:6px solid rgba(255,255,255,.12);
  box-shadow:0 0 20px rgba(0,0,0,.5);
}

.wheel-arrow{
  width:0;
  height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:20px solid white;
  position:absolute;
  top:-9px;
  z-index:3;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));
}

/* ---------- COMBO ---------- */

.combo-cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.combo-card{
  aspect-ratio:.75;
  border-radius:17px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.08);
  display:grid;
  place-items:center;
  position:relative;
  transition:.18s;
}

.combo-card.selected{
  transform:translateY(-7px);
  border-color:var(--cyan);
  box-shadow:
    0 10px 30px rgba(66,232,255,.15),
    inset 0 0 25px rgba(66,232,255,.07);
}

.combo-card svg{
  width:40px;
  height:40px;
}

.combo-num{
  position:absolute;
  left:8px;
  top:7px;
  font-size:10px;
  color:var(--muted);
  font-weight:850;
}

/* ---------- EARN ---------- */

.earn-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.ad-network{
  padding:17px;
  border-radius:23px;
  margin-bottom:10px;
}

.ad-network-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.network-name{
  font-weight:900;
}

.ad-count{
  color:var(--muted);
  font-size:11px;
}

.ad-network p{
  font-size:11px;
  color:var(--muted);
  margin:7px 0 13px;
}

.task{
  padding:15px;
  border-radius:19px;
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:9px;
}

.task-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(89,240,163,.1);
  color:var(--green);
}

.task-info{
  flex:1;
}

.task-name{
  font-size:13px;
  font-weight:850;
}

.task-reward{
  font-size:10px;
  color:var(--green);
  margin-top:3px;
}

/* ---------- WALLET ---------- */

.wallet-balance{
  padding:22px;
  border-radius:27px;
  background:
    radial-gradient(circle at 90% 0%,rgba(66,232,255,.13),transparent 35%),
    radial-gradient(circle at 10% 100%,rgba(166,108,255,.12),transparent 35%),
    rgba(255,255,255,.045);
}

.wallet-big{
  font-size:32px;
  font-weight:950;
  margin:7px 0;
}

.wallet-ton{
  color:#62adff;
  font-size:14px;
  font-weight:800;
}

.swap{
  margin-top:12px;
  padding:18px;
  border-radius:25px;
}

.swap-row{
  padding:12px 14px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.swap-row input{
  width:150px;
  background:none;
  border:0;
  outline:0;
  color:white;
  font-size:20px;
  font-weight:900;
  text-align:right;
}

.swap-arrow{
  width:38px;
  height:38px;
  border-radius:13px;
  margin:7px auto;
  display:grid;
  place-items:center;
  background:rgba(92,124,255,.14);
  color:var(--cyan);
}

.input{
  width:100%;
  height:48px;
  border-radius:15px;
  padding:0 14px;
  color:white;
  outline:0;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
}

.history{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-radius:16px;
  background:rgba(255,255,255,.035);
}

.history-type{
  font-size:12px;
  font-weight:800;
}

.history-date{
  color:var(--muted);
  font-size:10px;
}

.history-amount{
  font-size:12px;
  font-weight:850;
}

/* ---------- PROFILE ---------- */

.profile-hero{
  padding:23px;
  border-radius:28px;
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:12px;
}

.profile-avatar{
  width:70px;
  height:70px;
  border-radius:22px;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(66,232,255,.15),rgba(255,85,200,.15));
  display:grid;
  place-items:center;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:21px;
  font-weight:900;
}

.profile-id{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.profile-menu{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.profile-item{
  min-height:57px;
  padding:10px 13px;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.045);
}

.profile-item svg{
  width:21px;
  height:21px;
}

.profile-item span{
  flex:1;
  font-weight:750;
  font-size:14px;
}

.profile-item small{
  color:var(--muted);
}

/* ---------- TOP / FRIENDS / GIVEAWAYS ---------- */

.top-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:12px;
}

.leader{
  display:flex;
  align-items:center;
  padding:13px;
  border-radius:18px;
  gap:11px;
  margin-bottom:7px;
}

.rank{
  width:32px;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}

.leader-avatar{
  width:38px;
  height:38px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  display:grid;
  place-items:center;
  font-weight:900;
}

.leader-info{
  flex:1;
}

.leader-name{
  font-size:13px;
  font-weight:800;
}

.leader-stat{
  color:var(--muted);
  font-size:10px;
}

.leader-value{
  font-size:12px;
  font-weight:900;
}

.ref-card{
  padding:20px;
  border-radius:25px;
}

.ref-link{
  margin-top:12px;
  display:flex;
  gap:7px;
}

.ref-link input{
  min-width:0;
  flex:1;
}

.giveaway{
  padding:18px;
  border-radius:24px;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
}

.giveaway::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-40px;
  top:-45px;
  border-radius:50%;
  background:var(--violet);
  filter:blur(45px);
  opacity:.15;
}

.giveaway-title{
  font-size:18px;
  font-weight:900;
}

.giveaway-prize{
  color:var(--yellow);
  font-weight:900;
  margin:5px 0 12px;
}

.giveaway-meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  margin-bottom:13px;
}

/* ---------- NAV ---------- */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(620px,100%);
  padding:
    8px 9px
    calc(8px + env(safe-area-inset-bottom));
  z-index:50;
  background:rgba(7,9,16,.78);
  border-top:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  display:grid;
  grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;
  gap:4px;
}

.nav-btn{
  height:62px;
  background:none;
  color:#747c92;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  border-radius:17px;
  font-size:9px;
  font-weight:800;
}

.nav-btn svg{
  width:21px;
  height:21px;
}

.nav-btn.active{
  color:white;
}

.nav-btn.home{
  margin-top:-18px;
  height:68px;
  border-radius:22px;
  background:
    linear-gradient(145deg,rgba(92,124,255,.25),rgba(166,108,255,.2));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:
    0 8px 30px rgba(92,124,255,.2),
    inset 0 1px 0 rgba(255,255,255,.12);
}

.nav-btn.home svg{
  width:25px;
  height:25px;
}

/* ---------- TOAST ---------- */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:95px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:rgba(18,22,36,.92);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 15px 50px rgba(0,0,0,.45);
  backdrop-filter:blur(20px);
  padding:12px 16px;
  border-radius:15px;
  font-size:12px;
  font-weight:750;
  transition:.3s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:390px){
  .hero{height:275px}
  .orb{width:180px;height:180px}
  .home-action{height:100px}
  .boost-grid{grid-template-columns:1fr}
  .combo-cards{gap:4px}
}

/* ---------- SVG ZOMBIE ---------- */

.zombie-svg{
  overflow:visible;
}

.zombie-body{
  transform-origin:50% 50%;
}

.zombie-leg-a,
.zombie-leg-b,
.zombie-arm-a,
.zombie-arm-b{
  transform-box:fill-box;
  transform-origin:center top;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= HOME ================= -->

<section id="screen-home" class="screen active">

  <div class="home-head">
    <div class="user-box">
      <div class="avatar" id="homeAvatar"></div>
      <div>
        <div class="user-name" id="homeUsername">Zombie</div>
        <div class="user-level" id="homeLevel">LEVEL 1</div>
      </div>
    </div>

    <div class="balance-box">
      <div class="balance-zmb" id="homeZmb">0.0000 ZMB</div>
      <div class="balance-ton" id="homeTon">0.000 TON</div>
    </div>
  </div>

  <div class="hero">
    <div class="orb">
      <div class="liquid one"></div>
      <div class="liquid two"></div>
      <div class="liquid three"></div>
      <div class="orb-core"></div>
    </div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
  </div>

  <div class="home-grid">

    <button class="home-action a-mining" onclick="showScreen('mining')">
      <span id="homeMiningIcon"></span>
      <strong data-i18n="mining"></strong>
      <small data-i18n="mineZmb"></small>
    </button>

    <button class="home-action a-games" onclick="showScreen('games')">
      <span id="homeGamesIcon"></span>
      <strong data-i18n="games"></strong>
      <small data-i18n="playEarn"></small>
    </button>

    <button class="home-action a-earn" onclick="showScreen('earn')">
      <span id="homeEarnIcon"></span>
      <strong data-i18n="earn"></strong>
      <small data-i18n="watchAds"></small>
    </button>

    <button class="home-action a-give" onclick="showScreen('giveaways')">
      <span id="homeGiveIcon"></span>
      <strong data-i18n="giveaways"></strong>
      <small data-i18n="winPrizes"></small>
    </button>

  </div>

  <div class="level-card glass">
    <div class="level-row">
      <span id="levelText">LEVEL 1</span>
      <span id="levelProgressText">0 / 100</span>
    </div>
    <div class="progress">
      <i id="levelProgress"></i>
    </div>
  </div>

  <div class="section-title">
    <span data-i18n="recentPayouts"></span>
    <span class="muted" style="font-size:11px" data-i18n="demo"></span>
  </div>

  <div class="feed" id="payoutFeed"></div>

</section>

<!-- ================= MINING ================= -->

<section id="screen-mining" class="screen">

  <div class="topbar">
    <div>
      <div class="page-title" data-i18n="mining"></div>
      <div class="page-subtitle" data-i18n="miningSubtitle"></div>
    </div>
  </div>

  <div class="mining-card glass">

    <div class="muted" data-i18n="sessionEarnings"></div>

    <div class="mining-number" id="miningNumber">
      0.0000000 ZMB
    </div>

    <div class="mining-unit" data-i18n="accumulated"></div>

    <div class="mining-status">
      <span class="dot" id="miningDot"></span>
      <span id="miningStatusText"></span>
    </div>

    <div class="mining-actions">
      <button class="btn green" id="miningStartBtn" onclick="startMining()"></button>
      <button class="btn secondary" id="miningClaimBtn" onclick="claimMining()"></button>
    </div>

  </div>

  <div class="mining-tabs">
    <button class="tab active" id="shopTab" onclick="switchMiningTab('shop')"
      data-i18n="shop"></button>
    <button class="tab" id="boostsTab" onclick="switchMiningTab('boosts')"
      data-i18n="boosts"></button>
  </div>

  <div id="shopPanel">
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <div id="boostsPanel" style="display:none">
    <div class="boost-grid" id="boostGrid"></div>
  </div>

</section>

<!-- ================= GAMES ================= -->

<section id="screen-games" class="screen">

  <div class="page-title" data-i18n="games"></div>
  <div class="page-subtitle" data-i18n="gamesSubtitle"></div>

  <div class="game-list">

    <button class="game-card glass" onclick="openGame('flip')">
      <div class="game-card-content">
        <h3 data-i18n="zombieFlip"></h3>
        <p data-i18n="zombieFlipDesc"></p>
      </div>

      <div class="game-mini-zombie">
        <svg class="zombie-svg" viewBox="0 0 70 90">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
            <path d="M35 52v22"/>
            <path d="M29 73l-7 10"/>
            <path d="M41 73l8 9"/>
            <path d="M27 58l-12 7"/>
            <path d="M43 58l12 5"/>
          </g>
          <path d="M17 29Q18 9 35 10Q53 9 54 30v23Q35 62 16 52Z"
            fill="#6ce8a3" stroke="#1b573e" stroke-width="2"/>
          <circle cx="27" cy="29" r="3" fill="#111"/>
          <circle cx="43" cy="27" r="3" fill="#111"/>
          <path d="M27 41Q35 46 44 40" fill="none" stroke="#111" stroke-width="2"/>
        </svg>
      </div>

      <span class="play" id="flipPlayIcon"></span>
    </button>

    <button class="game-card run glass" onclick="openGame('run')">
      <div class="game-card-content">
        <h3 data-i18n="zombieRun"></h3>
        <p data-i18n="zombieRunDesc"></p>
      </div>

      <div class="game-mini-zombie">
        <svg class="zombie-svg" viewBox="0 0 70 90">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
            <path d="M35 52v22"/>
            <path d="M30 73l-10 9"/>
            <path d="M41 73l10 5"/>
            <path d="M27 58l-13 2"/>
            <path d="M44 58l12-6"/>
          </g>
          <path d="M17 29Q18 9 35 10Q53 9 54 30v23Q35 62 16 52Z"
            fill="#70e7a2" stroke="#1b573e" stroke-width="2"/>
          <circle cx="27" cy="29" r="3" fill="#111"/>
          <circle cx="43" cy="27" r="3" fill="#111"/>
          <path d="M27 41Q35 46 44 40" fill="none" stroke="#111" stroke-width="2"/>
        </svg>
      </div>

      <span class="play" id="runPlayIcon"></span>
    </button>

    <button class="home-action a-games" style="width:100%" onclick="openWheel()">
      <span id="wheelIcon"></span>
      <strong data-i18n="dailyWheel"></strong>
      <small data-i18n="dailyWheelDesc"></small>
    </button>

    <button class="home-action a-mining" style="width:100%" onclick="openCombo()">
      <span id="comboIcon"></span>
      <strong data-i18n="dailyCombo"></strong>
      <small data-i18n="dailyComboDesc"></small>
    </button>

  </div>

</section>

<!-- ================= EARN ================= -->

<section id="screen-earn" class="screen">

  <div class="page-title" data-i18n="earn"></div>
  <div class="page-subtitle" data-i18n="earnSubtitle"></div>

  <div class="earn-tabs">
    <button class="tab active" id="adsTab" onclick="switchEarnTab('ads')"
      data-i18n="ads"></button>
    <button class="tab" id="promoteTab" onclick="switchEarnTab('promote')"
      data-i18n="promote"></button>
  </div>

  <div id="adsPanel"></div>

  <div id="promotePanel" style="display:none">

    <div class="card glass">
      <div class="section-title" style="margin-top:0">
        <span data-i18n="promoteTitle"></span>
      </div>

      <div class="muted" style="font-size:11px;line-height:1.5;margin-bottom:13px"
        data-i18n="promoteDesc"></div>

      <input class="input" id="promoteLink"
        data-i18n-placeholder="channelLink">

      <div class="section-title">
        <span data-i18n="package"></span>
      </div>

      <div class="shop-grid">

        <button class="miner glass" onclick="selectPackage(0)">
          <div class="miner-info">
            <div class="miner-name">START</div>
            <div class="miner-desc" data-i18n="promoStart"></div>
          </div>
          <div class="miner-buy">1 TON</div>
        </button>

        <button class="miner glass" onclick="selectPackage(1)">
          <div class="miner-info">
            <div class="miner-name">BOOST</div>
            <div class="miner-desc" data-i18n="promoBoost"></div>
          </div>
          <div class="miner-buy">3 TON</div>
        </button>

        <button class="miner glass" onclick="selectPackage(2)">
          <div class="miner-info">
            <div class="miner-name">MAX</div>
            <div class="miner-desc" data-i18n="promoMax"></div>
          </div>
          <div class="miner-buy">7 TON</div>
        </button>

      </div>

      <button class="btn full" style="margin-top:13px" onclick="demoPayment()"
        data-i18n="pay"></button>
    </div>

  </div>

</section>

<!-- ================= WALLET ================= -->

<section id="screen-wallet" class="screen">

  <div class="page-title" data-i18n="wallet"></div>
  <div class="page-subtitle" data-i18n="walletSubtitle"></div>

  <div class="wallet-balance glass">
    <div class="muted" data-i18n="zmbBalance"></div>
    <div class="wallet-big" id="walletZmb">0.0000 ZMB</div>
    <div class="wallet-ton" id="walletTon">0.000 TON</div>
  </div>

  <div class="swap glass">

    <div class="section-title" style="margin-top:0">
      <span data-i18n="swap"></span>
      <span class="muted" style="font-size:10px" id="swapRate"></span>
    </div>

    <div class="swap-row">
      <span>ZMB</span>
      <input id="swapFrom" type="number" min="0" step="0.0001"
        placeholder="0" oninput="updateSwap()">
    </div>

    <div class="swap-arrow" onclick="reverseSwap()" id="swapArrow"></div>

    <div class="swap-row">
      <span id="swapToLabel">TON</span>
      <span id="swapOutput" style="font-weight:900">0.0000</span>
    </div>

    <button class="btn full" style="margin-top:12px" onclick="executeSwap()"
      data-i18n="swapNow"></button>
  </div>

  <div class="card glass" style="margin-top:12px">

    <div class="section-title" style="margin-top:0">
      <span data-i18n="withdraw"></span>
      <span class="muted" style="font-size:10px" data-i18n="tonOnly"></span>
    </div>

    <input class="input" id="withdrawAddress"
      data-i18n-placeholder="tonAddress">

    <input class="input" id="withdrawAmount"
      type="number"
      min="0"
      step="0.01"
      style="margin-top:8px"
      data-i18n-placeholder="amountTon">

    <div style="display:flex;justify-content:space-between;margin:10px 2px;font-size:11px">
      <span class="muted" data-i18n="minimum"></span>
      <span>0.5 TON</span>
    </div>

    <button class="btn pink full" onclick="withdrawTon()"
      data-i18n="requestWithdraw"></button>

  </div>

  <div class="section-title">
    <span data-i18n="history"></span>
  </div>

  <div class="history" id="historyList"></div>

</section>

<!-- ================= PROFILE ================= -->

<section id="screen-profile" class="screen">

  <div class="profile-hero glass">

    <div class="profile-avatar" id="profileAvatar"></div>

    <div>
      <div class="profile-name" id="profileName">Zombie</div>
      <div class="profile-id" id="profileId">@zombie</div>
    </div>

  </div>

  <div class="profile-menu">

    <button class="profile-item" onclick="openProfileAction('withdraw')">
      <span id="piWithdraw"></span>
      <span data-i18n="withdraw"></span>
      <small>›</small>
    </button>

    <button class="profile-item" onclick="openProfileAction('swap')">
      <span id="piSwap"></span>
      <span data-i18n="swap"></span>
      <small>›</small>
    </button>

    <button class="profile-item" onclick="openProfileAction('statistics')">
      <span id="piStats"></span>
      <span data-i18n="statistics"></span>
      <small>›</small>
    </button>

    <button class="profile-item" onclick="openProfileAction('bonuses')">
      <span id="piBonus"></span>
      <span data-i18n="bonuses"></span>

function t(key){
  const lang = state.language || "ru";
  return I18N[lang]?.[key] || I18N.en[key] || key;
}

function applyLanguage(){

  document.documentElement.lang = state.language;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent=t(el.dataset.i18n);
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    el.placeholder=t(el.dataset.i18nPlaceholder);
  });

  renderAll();
}

function loadState(){

  try{

    const saved=localStorage.getItem("paid_zombie_state");

    if(!saved) return structuredClone(DEFAULT_STATE);

    const parsed=JSON.parse(saved);

    return deepMerge(structuredClone(DEFAULT_STATE),parsed);

  }catch(e){

    return structuredClone(DEFAULT_STATE);

  }

}

function deepMerge(base,extra){

  for(const key in extra){

    if(
      extra[key] &&
      typeof extra[key]==="object" &&
      !Array.isArray(extra[key]) &&
      base[key]
    ){

      deepMerge(base[key],extra[key]);

    }else{

      base[key]=extra[key];

    }

  }

  return base;
}

let state=loadState();

function saveState(){

  localStorage.setItem(
    "paid_zombie_state",
    JSON.stringify(state)
  );

}

function escapeHTML(value){

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

  document.querySelectorAll(".screen").forEach(
    s=>s.classList.remove("active")
  );

  if(screen) screen.classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(btn=>{

    );

  });

}

/* ================= MINING ================= */

function getMiningRate(){

  let rate=state.mining.rate;

  for(const id of state.miners){

    const miner=MINERS.find(m=>m.id===id);

    if(miner) rate+=miner.rate;

  }

  if(state.boosts.speed){

    const boost=BOOSTS.find(b=>b.id==="speed");

    if(boost && state.boosts.speed>0){

      rate*=1.5;

    }

  }

  return rate;

}

function getMiningAccrued(){

  if(!state.mining.active) {
    return state.mining.accumulated;
  }

  const elapsed=Math.max(
    0,
    (Date.now()-state.mining.startedAt)/1000
  );

  return state.mining.accumulated+
    elapsed*getMiningRate();

}

function startMining(){

  if(state.mining.active){

    toast(t("active"));

    return;

  }

  state.mining.active=true;

  state.mining.startedAt=Date.now();

  saveState();

  toast(t("miningStarted"));

  renderMining();

}

function claimMining(){

  const amount=getMiningAccrued();

  if(amount<=0){

    toast(t("insufficient"));

    return;

  }

  state.balance+=amount;

  state.mining.active=false;

  state.mining.startedAt=0;

  state.mining.accumulated=0;

  addXp(amount);

  saveState();

  toast(
    `${t("miningClaimed")}: +${formatZmb(amount)} ZMB`
  );

  renderAll();

}

function renderMining(){

  const accrued=getMiningAccrued();

  const num=document.getElementById("miningNumber");

  if(num){

    num.textContent=
      `${formatMining(accrued)} ZMB`;

  }

  const dot=document.getElementById("miningDot");

  if(dot){

    dot.classList.toggle("on",state.mining.active);

  }

  const status=document.getElementById("miningStatusText");

  if(status){

    status.textContent=
      state.mining.active
        ? t("active")
        : t("inactive");

  }

  const start=document.getElementById("miningStartBtn");
  const claim=document.getElementById("miningClaimBtn");

  if(start){

    start.textContent=
      state.mining.active
        ? t("active")
        : t("start");

  }

  if(claim){

    claim.textContent=t("claim");

    claim.disabled=
      state.mining.active===false &&
      state.mining.accumulated<=0;

  }

  renderShop();
  renderBoosts();

}

const WHEEL_REWARDS=[

  .25,
  .5,
  1,
  .15,
  2,
  .35,
  .75,
  1.5

];

function openWheel(){

  document.getElementById("wheelModal").classList.add("active");

function updateWheel(){

  const used=
    Date.now()-state.wheelLast<24*60*60*1000;

  const btn=document.getElementById("spinButton");

  const cooldown=document.getElementById("wheelCooldown");

  if(used){

    btn.disabled=true;

    cooldown.textContent=t("tomorrow");

  }else{

    btn.disabled=false;

    cooldown.textContent=t("ready");

  }

}

function spinWheel(){

  if(Date.now()-state.wheelLast<24*60*60*1000){

    toast(t("alreadySpun"));

    return;

  }

  const wheel=document.getElementById("wheel");

  const index=Math.floor(
    Math.random()*WHEEL_REWARDS.length
  );

  const reward=
    WHEEL_REWARDS[index]*
    (1+(state.boosts.wheel||0)*.25);

  const segment=360/WHEEL_REWARDS.length;

  const target=
    360*6+
    (360-(index*segment+segment/2));

  wheel.style.transform=`rotate(${target}deg)`;

  state.wheelLast=Date.now();

  setTimeout(()=>{

    state.balance+=reward;

    addXp(reward);

    saveState();

    toast(
      `${t("wheelReward")}: +${reward.toFixed(2)} ZMB`
    );

    updateWheel();
    renderAll();

  },4100);

}

  /*

const ZMB_TO_TON=.01;

let swapDirection="zmbTon";

function updateWallet(){

  document.getElementById("walletZmb").textContent=
    `${formatZmb(state.balance)} ZMB`;

  document.getElementById("walletTon").textContent=
    `${formatTon(state.ton)} TON`;

  document.getElementById("swapRate").textContent=
    `1 ZMB = ${ZMB_TO_TON} TON`;

  updateSwap();

  renderHistory();

}

function updateSwap(){

  const value=
    Number(document.getElementById("swapFrom")?.value||0);

  const output=
    swapDirection==="zmbTon"
      ? value*ZMB_TO_TON
      : value/ZMB_TO_TON;

  const label=document.getElementById("swapToLabel");

  if(label){

    label.textContent=
      swapDirection==="zmbTon"
        ?"TON"
        :"ZMB";

  }

  const out=document.getElementById("swapOutput");

  if(out){

    out.textContent=
      swapDirection==="zmbTon"
        ?output.toFixed(4)
        :output.toFixed(2);

  }

}

function reverseSwap(){

  swapDirection=
    swapDirection==="zmbTon"
      ?"tonZmb"
      :"zmbTon";

  updateSwap();

}

function executeSwap(){

  const value=
    Number(document.getElementById("swapFrom").value||0);

  if(value<=0){

    toast(t("invalidAmount"));

    return;

  }

  if(swapDirection==="zmbTon"){

    if(value>state.balance){

      toast(t("insufficient"));

      return;

    }

    state.balance-=value;

    state.ton+=value*ZMB_TO_TON;

  }else{

    if(value>state.ton){

      toast(t("insufficient"));

      return;

    }

    state.ton-=value;

    state.balance+=value/ZMB_TO_TON;

  }

  state.history.unshift({

    type:"SWAP",

    amount:
      swapDirection==="zmbTon"
        ?`-${value.toFixed(2)} ZMB`
        :`-${value.toFixed(3)} TON`,

    date:new Date().toLocaleString()

  });

  document.getElementById("swapFrom").value="";

  saveState();

  toast(t("saved"));

  renderAll();

}

function withdrawTon(){

  const address=
    document.getElementById("withdrawAddress").value.trim();

  const amount=
    Number(document.getElementById("withdrawAmount").value||0);

  if(!address){

    toast(t("invalidAddress"));

    return;

  }

  if(amount<.5){

    toast(t("minimum")+": 0.5 TON");

    return;

  }

  if(amount>state.ton){

    toast(t("insufficient"));

    return;

  }

  state.ton-=amount;

  state.history.unshift({

    type:"WITHDRAW",

    amount:`-${amount.toFixed(3)} TON`,

    date:new Date().toLocaleString()

  });

  saveState();

  toast(t("withdrawDemo"));

  renderAll();

}

/* ---------- GAME ZOMBIE DRAW ---------- */

function drawZombie(x,y,scale=1,tilt=0,runPhase=0){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(tilt);

  /* shadow */
  ctx.save();
  ctx.translate(0,31*scale);
  ctx.scale(1,.28);
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath();
  ctx.ellipse(0,0,28*scale,9*scale,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* legs */

  const legA=Math.sin(runPhase)*.65;
  const legB=Math.sin(runPhase+Math.PI)*.65;

  ctx.strokeStyle="#73e8a7";
  ctx.lineWidth=7*scale;
  ctx.lineCap="round";

  ctx.save();
  ctx.rotate(legA);
  ctx.beginPath();
  ctx.moveTo(-8*scale,19*scale);
  ctx.lineTo(-15*scale,43*scale);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.rotate(legB);
  ctx.beginPath();
  ctx.moveTo(8*scale,19*scale);
  ctx.lineTo(16*scale,42*scale);
  ctx.stroke();
  ctx.restore();

  /* shoes */

  ctx.strokeStyle="#172c28";
  ctx.lineWidth=8*scale;

  ctx.beginPath();
  ctx.moveTo(-15*scale,43*scale);
  ctx.lineTo(-24*scale,43*scale);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(16*scale,42*scale);
  ctx.lineTo(25*scale,42*scale);
  ctx.stroke();

  /* arms */

  const armA=Math.sin(runPhase+Math.PI)*.45;
  const armB=Math.sin(runPhase)*.45;

  ctx.strokeStyle="#69d99b";
  ctx.lineWidth=7*scale;

  ctx.save();
  ctx.translate(-16*scale,-3*scale);
  ctx.rotate(armA);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(-17*scale,15*scale);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(16*scale,-3*scale);
  ctx.rotate(armB);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(18*scale,10*scale);
  ctx.stroke();
  ctx.restore();

  /* body */

  ctx.fillStyle="#6fe3a1";
  ctx.strokeStyle="#173f30";
  ctx.lineWidth=2*scale;

  ctx.beginPath();
  ctx.roundRect(
    -20*scale,
    -22*scale,
    40*scale,
    46*scale,
    13*scale
  );
  ctx.fill();
  ctx.stroke();

  /* torn shirt */

  ctx.fillStyle="#324e73";

  ctx.beginPath();
  ctx.moveTo(-17*scale,3*scale);
  ctx.lineTo(-6*scale,-1*scale);
  ctx.lineTo(0,5*scale);
  ctx.lineTo(9*scale,-1*scale);
  ctx.lineTo(18*scale,4*scale);
  ctx.lineTo(17*scale,20*scale);
  ctx.lineTo(-17*scale,20*scale);
  ctx.closePath();
  ctx.fill();

  /* head */

  ctx.fillStyle="#77eca7";

  ctx.beginPath();
  ctx.arc(0,-34*scale,20*scale,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  /* ear */

  ctx.beginPath();
  ctx.arc(-20*scale,-34*scale,6*scale,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(20*scale,-34*scale,6*scale,0,Math.PI*2);
  ctx.fill();

  /* hair */

  ctx.fillStyle="#20372f";

  ctx.beginPath();
  ctx.moveTo(-18*scale,-44*scale);
  ctx.lineTo(-9*scale,-55*scale);
  ctx.lineTo(-4*scale,-47*scale);
  ctx.lineTo(3*scale,-57*scale);
  ctx.lineTo(9*scale,-47*scale);
  ctx.lineTo(17*scale,-52*scale);
  ctx.lineTo(18*scale,-38*scale);
  ctx.lineTo(-18*scale,-38*scale);
  ctx.closePath();
  ctx.fill();

  /* eyes */

  ctx.fillStyle="#10131a";

  ctx.beginPath();
  ctx.arc(-7*scale,-35*scale,3.2*scale,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(7*scale,-35*scale,3.2*scale,0,Math.PI*2);
  ctx.fill();

  /* mouth */

  ctx.strokeStyle="#18231e";
  ctx.lineWidth=2*scale;

  ctx.beginPath();
  ctx.moveTo(-9*scale,-26*scale);
  ctx.quadraticCurveTo(
    0,-21*scale,
    10*scale,-27*scale
  );
  ctx.stroke();

  /* teeth */

  ctx.fillStyle="#f1f3d7";

  for(let i=-1;i<=1;i++){

    ctx.fillRect(
      i*5*scale-2*scale,
      -27*scale,
      4*scale,
      4*scale
    );

  }

  ctx.restore();

}

/* ---------- BACKGROUND ---------- */

function drawGameBackground(type,time){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  const grad=ctx.createLinearGradient(0,0,0,h);

  if(type==="flip"){

    grad.addColorStop(0,"#08152b");
    grad.addColorStop(.55,"#151039");
    grad.addColorStop(1,"#060812");

  }else{

    grad.addColorStop(0,"#09182a");
    grad.addColorStop(.6,"#10152a");
    grad.addColorStop(1,"#07100f");

  }

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);

  /* glow */

  const glow=ctx.createRadialGradient(
    w*.5,
    h*.35,
    0,
    w*.5,
    h*.35,
    h*.7
  );

  glow.addColorStop(
    0,
    type==="flip"
      ?"rgba(166,108,255,.16)"
      :"rgba(66,232,255,.12)"
  );

  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,w,h);

  /* floating dots */

  for(let i=0;i<28;i++){

    const x=(i*83)%w;
    const y=((i*127+time*.012*(i%3+1))%(h+80))-40;

    ctx.fillStyle=
      i%3===0
        ?"rgba(66,232,255,.16)"
        :"rgba(255,255,255,.07)";

    ctx.beginPath();
    ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);
    ctx.fill();

  }

}

/* ---------- FLIP GAME ---------- */

function initFlip(){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  gameState={

    y:h*.46,
    vy:0,

    gravity:.0019,
    flap:-.56,

    pipes:[],
    timer:0,

    score:0,
    earned:0,

    started:false,
    over:false,

    lastPipe:0

  };

}

function flap(){

  if(!gameRunning || gameType!=="flip") return;

  if(!gameState.started){

    gameState.started=true;

    document.getElementById("gameHint")
      .classList.add("hidden");

  }

  if(gameState.over){

    restartGame();

    return;

  }

  gameState.vy=gameState.flap;

  playJumpSound();

}

function updateFlip(dt,time){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  if(!gameState.started) return;

  gameState.vy+=gameState.gravity*dt;

  gameState.y+=gameState.vy*dt;

  gameState.timer+=dt;

  if(
    gameState.timer-gameState.lastPipe>1450
  ){

    gameState.lastPipe=gameState.timer;

    const gap=155;

    const min=100;
    const max=h-150-gap;

    const gapY=
      min+Math.random()*Math.max(40,max-min);

    gameState.pipes.push({

      x:w+35,
      gapY,
      gap,

      passed:false

    });

  }

  for(const pipe of gameState.pipes){

    pipe.x-=.27*dt;

    if(
      !pipe.passed &&
      pipe.x+64<70
    ){

      pipe.passed=true;

      gameState.score++;

      gameState.earned+=
        .12*(1+(state.boosts.game||0)*.2);

    }

  }

  gameState.pipes=
    gameState.pipes.filter(p=>p.x>-100);

  const zombieX=75;
  const zy=gameState.y;

  const zombieTop=zy-46;
  const zombieBottom=zy+44;

  if(
    zombieTop<62 ||
    zombieBottom>h-25
  ){

    endGame();

    return;

  }

  for(const p of gameState.pipes){

    const pipeLeft=p.x;
    const pipeRight=p.x+65;

    const hitX=
      zombieX+23>pipeLeft &&
      zombieX-23<pipeRight;

    const hitY=
      zombieTop<p.gapY ||
      zombieBottom>p.gapY+p.gap;

    if(hitX&&hitY){

      endGame();

      return;

    }

  }

  document.getElementById("gameScore").textContent=
    `${t("score")}: ${gameState.score}`;

  document.getElementById("gameEarned").textContent=
    `+${gameState.earned.toFixed(4)} ZMB`;

}

function drawFlip(time){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  drawGameBackground("flip",time);

  /* pipes */

  for(const p of gameState.pipes){

    const pipeGrad=ctx.createLinearGradient(
      p.x,0,p.x+65,0
    );

    pipeGrad.addColorStop(0,"#3155c5");
    pipeGrad.addColorStop(.5,"#5c7cff");
    pipeGrad.addColorStop(1,"#273d9b");

    ctx.fillStyle=pipeGrad;

    ctx.fillRect(
      p.x,
      0,
      65,
      p.gapY
    );

    ctx.fillRect(
      p.x,
      p.gapY+p.gap,
      65,
      h
    );

    ctx.fillStyle="rgba(255,255,255,.09)";

    ctx.fillRect(
      p.x-5,
      p.gapY-17,
      75,
      17
    );

    ctx.fillRect(
      p.x-5,
      p.gapY+p.gap,
      75,
      17
    );

  }

  const tilt=Math.max(
    -.45,
    Math.min(.75,gameState.vy*.9)
  );

  const bob=
    Math.sin(time*.012)*2;

  drawZombie(
    75,
    gameState.y+bob,
    .85,
    tilt,
    time*.018
  );

}

/* ---------- RUN GAME ---------- */

function initRun(){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  gameState={

    ground:h-86,

    y:h-130,
    vy:0,

    gravity:.0023,
    jump:-.76,

    speed:.34,

    started:false,
    over:false,

    time:0,
    score:0,
    earned:0,

    obstacles:[],
    coins:[],

    obstacleTimer:0,
    coinTimer:0,

    runPhase:0

  };

}

function runJump(){

  if(!gameRunning || gameType!=="run") return;

  if(!gameState.started){

    gameState.started=true;

    document.getElementById("gameHint")
      .classList.add("hidden");

  }

  if(gameState.over){

    restartGame();

    return;

  }

  if(
    gameState.y>=gameState.ground-1
  ){

    gameState.vy=gameState.jump;

    playJumpSound();

  }

}

function updateRun(dt,time){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  if(!gameState.started) return;

  gameState.time+=dt;

  gameState.speed=
    Math.min(
      .62,
      .34+gameState.time*.000012
    );

  gameState.vy+=gameState.gravity*dt;

  gameState.y+=gameState.vy*dt;

  if(gameState.y>gameState.ground){

    gameState.y=gameState.ground;
    gameState.vy=0;

  }

  gameState.runPhase+=dt*.015;

  gameState.obstacleTimer+=dt;

  const obstacleDelay=
    Math.max(
      820,
      1450-gameState.time*.04
    );

  if(gameState.obstacleTimer>obstacleDelay){

    gameState.obstacleTimer=0;

    const height=
      34+Math.random()*34;

    const width=
      20+Math.random()*30;

    gameState.obstacles.push({

      x:w+30,
      width,
      height

    });

  }

  gameState.coinTimer+=dt;

  if(gameState.coinTimer>600){

    gameState.coinTimer=0;

    const baseY=
      gameState.ground-
      35-
      Math.random()*55;

    gameState.coins.push({

      x:w+30,
      y:baseY,
      r:8,
      collected:false

    });

  }

  for(const obstacle of gameState.obstacles){

    obstacle.x-=gameState.speed*dt;

  }

  for(const coin of gameState.coins){

    coin.x-=gameState.speed*dt;

    coin.y+=
      Math.sin((time+coin.x)*.008)*.12;

  }

  gameState.obstacles=
    gameState.obstacles.filter(
      o=>o.x+o.width>-50
    );

  gameState.coins=
    gameState.coins.filter(
      c=>c.x>-50&&!c.collected
    );

  const zx=95;
  const zy=gameState.y-23;

  /* obstacle collision */

  for(const o of gameState.obstacles){

    const ox=o.x;
    const oy=gameState.ground-o.height;

    const hit=
      zx+20>ox &&
      zx-20<ox+o.width &&
      zy+43>oy &&
      zy-43<gameState.ground;

    if(hit){

      endGame();

      return;

    }

  }

  /* coins */

  for(const c of gameState.coins){

    const dx=c.x-zx;
    const dy=c.y-zy;

    if(
      Math.sqrt(dx*dx+dy*dy)<28
    ){

      c.collected=true;

      gameState.score++;

      gameState.earned+=
        .15*(1+(state.boosts.game||0)*.2);

    }

  }

  /* passive score */

  if(
    Math.floor(gameState.time/1000)>
    gameState.score
  ){

    gameState.score++;

    gameState.earned+=
      .025*(1+(state.boosts.game||0)*.2);

  }

  document.getElementById("gameScore").textContent=
    `${t("score")}: ${gameState.score}`;

  document.getElementById("gameEarned").textContent=
    `+${gameState.earned.toFixed(4)} ZMB`;

}

function drawRun(time){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  drawGameBackground("run",time);

  /* moon */

  ctx.fillStyle="rgba(230,250,255,.08)";
  ctx.beginPath();
  ctx.arc(w-70,105,38,0,Math.PI*2);
  ctx.fill();

  /* distant city */

  ctx.fillStyle="rgba(74,104,151,.13)";

  for(let i=0;i<15;i++){

    const bw=25+(i%4)*12;
    const bh=25+(i%5)*13;

    ctx.fillRect(
      i*55,
      gameState.ground-bh,
      bw,
      bh
    );

  }

  /* ground */

  ctx.fillStyle="#101a1c";

  ctx.fillRect(
    0,
    gameState.ground,
    w,
    h-gameState.ground
  );

  ctx.strokeStyle="rgba(89,240,163,.18)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(0,gameState.ground);
  ctx.lineTo(w,gameState.ground);
  ctx.stroke();

  /* ground lines */

  const offset=
    (gameState.time*.0003)%80;

  ctx.strokeStyle="rgba(255,255,255,.04)";
  ctx.lineWidth=2;

  for(let x=-80;x<w+80;x+=80){

    ctx.beginPath();
    ctx.moveTo(x-offset,gameState.ground+22);
    ctx.lineTo(x+40-offset,gameState.ground+22);
    ctx.stroke();

  }

  /* obstacles */

  for(const o of gameState.obstacles){

    const x=o.x;
    const y=gameState.ground-o.height;

    ctx.fillStyle="#4cbd79";

    ctx.beginPath();

    ctx.roundRect(
      x,
      y,
      o.width,
      o.height,
      5
    );

    ctx.fill();

    /* cactus branches */

    if(o.height>48){

      ctx.fillRect(
        x-10,
        y+18,
        10,
        7
      );

      ctx.fillRect(
        x+o.width,
        y+28,
        9,
        7
      );

    }

    ctx.fillStyle="rgba(255,255,255,.12)";

    ctx.fillRect(
      x+4,
      y+5,
      3,
      o.height-10
    );

  }

  /* coins */

  for(const c of gameState.coins){

    ctx.save();

    ctx.translate(c.x,c.y);

    ctx.rotate(time*.004);

    ctx.fillStyle="#ffd96b";
    ctx.shadowColor="#ffd96b";
    ctx.shadowBlur=15;

    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#8c6515";
    ctx.font="bold 9px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("Z",0,1);

    ctx.restore();

  }

  const jumpTilt=
    Math.max(
      -.35,
      Math.min(.25,gameState.vy*.5)
    );

  drawZombie(
    95,
    gameState.y,
    .82,
    jumpTilt,
    gameState.runPhase
  );

}

/* ---------- GAME LOOP ---------- */

function gameLoop(time){

  if(!gameRunning) return;

  const dt=Math.min(
    32,
    time-lastFrame||16
  );

  lastFrame=time;

  if(gameType==="flip"){

    updateFlip(dt,time);
    drawFlip(time);

  }else{

    updateRun(dt,time);
    drawRun(time);

  }

  gameRAF=requestAnimationFrame(gameLoop);

}

function openGame(type){

  gameType=type;

  gameRunning=true;

  gameStarted=false;

  document.getElementById("gameModal")
    .classList.add("active");

  document.getElementById("gameHintTitle").textContent=
    t("tapToStart");

  document.getElementById("gameHintSub").textContent=
    t("tapToPlay");

  document.getElementById("gameHint")
    .classList.remove("hidden");

  document.getElementById("gameOver")
    .classList.remove("active");

  resizeCanvas();

  if(type==="flip"){

    initFlip();

  }else{

    initRun();

  }

  lastFrame=performance.now();

  cancelAnimationFrame(gameRAF);

  gameRAF=requestAnimationFrame(gameLoop);

}

function closeGame(){

  gameRunning=false;

  cancelAnimationFrame(gameRAF);

  document.getElementById("gameModal")
    .classList.remove("active");

  gameType=null;

}

function endGame(){

  if(gameState.over) return;

  gameState.over=true;

  gameRunning=true;

  document.getElementById("gameOverTitle").textContent=
    t("gameOver");

  document.getElementById("gameResult").textContent=
    `${t("score")}: ${gameState.score} · ${t("earned")}: ${gameState.earned.toFixed(4)} ZMB`;

  document.getElementById("gameRestart").textContent=
    t("restart");

  document.getElementById("gameOver")
    .classList.add("active");

  state.gamesPlayed++;

  state.gameStats[gameType]++;

  if(gameState.earned>0){

    state.balance+=gameState.earned;

    addXp(gameState.earned);

  }

  saveState();

  document.getElementById("gameScore").textContent=
    `${t("score")}: ${gameState.score}`;

}

function restartGame(){

  document.getElementById("gameOver")
    .classList.remove("active");

  if(gameType==="flip"){

    initFlip();

  }else{

    initRun();

  }

  document.getElementById("gameHint")
    .classList.remove("hidden");

  document.getElementById("gameHintTitle").textContent=
    t("tapToStart");

  document.getElementById("gameHintSub").textContent=
    t("tapToPlay");

}

/* ---------- GAME INPUT ---------- */

function gameInput(){

  if(!gameRunning) return;

  if(gameType==="flip"){

    flap();

  }else{

    runJump();

  }

}

document.getElementById("gameCanvas")
  .addEventListener("pointerdown",e=>{
    e.preventDefault();
    gameInput();
  });

window.addEventListener("keydown",e=>{

  if(
    e.code==="Space" ||
    e.code==="ArrowUp"
  ){

    if(gameRunning){

      e.preventDefault();

      gameInput();

    }

  }

});

/* ---------- SOUND ---------- */

let audioCtx=null;

function playJumpSound(){

  try{

    audioCtx ||= new (
      window.AudioContext||
      window.webkitAudioContext
    )();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
      420,
      audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      720,
      audioCtx.currentTime+.09
    );

    gain.gain.setValueAtTime(
      .045,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+.11
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+.12);

  }catch{}

}
