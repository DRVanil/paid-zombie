<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#080b12" />
  <title>PAID ZOMBIE</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #080b12;
      --bg2: #0c111b;
      --card: rgba(17, 23, 35, .82);
      --card2: rgba(21, 28, 43, .92);
      --line: rgba(255,255,255,.075);

      --text: #f5f7fb;
      --muted: #8e98aa;

      --cyan: #38d9ff;
      --blue: #4c7dff;
      --purple: #9b6cff;
      --pink: #f35cff;
      --green: #45e39b;
      --yellow: #ffd45a;
      --red: #ff5f70;

      --radius: 20px;
      --nav-height: 74px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 10% 0%, rgba(56,217,255,.08), transparent 28%),
        radial-gradient(circle at 100% 10%, rgba(155,108,255,.09), transparent 30%),
        linear-gradient(180deg, #080b12 0%, #090d15 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    img {
      max-width: 100%;
    }

    #app {
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        16px
        20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .user-mini {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 14px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(56,217,255,.28), rgba(155,108,255,.35));
      border: 1px solid rgba(255,255,255,.09);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      max-width: 180px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .brand {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .brand span {
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 25px 22px 22px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,.09);
      background:
        radial-gradient(circle at 85% 15%, rgba(155,108,255,.17), transparent 35%),
        radial-gradient(circle at 5% 100%, rgba(56,217,255,.1), transparent 38%),
        linear-gradient(145deg, rgba(19,26,40,.96), rgba(12,16,25,.96));
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
    }

    .balance-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .balance-value {
      margin-top: 6px;
      font-size: clamp(34px, 10vw, 52px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
      overflow-wrap: anywhere;
    }

    .balance-unit {
      font-size: 18px;
      color: var(--cyan);
      letter-spacing: 0;
      margin-left: 5px;
    }

    .ton-balance {
      margin-top: 9px;
      color: #76a4ff;
      font-size: 14px;
      font-weight: 700;
    }

    .balance-actions {
      display: flex;
      gap: 9px;
      margin-top: 20px;
    }

    .small-btn {
      min-height: 40px;
      padding: 0 15px;
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
      color: #dfe5ef;
      font-size: 12px;
      font-weight: 800;
    }

    .small-btn.primary {
      background: linear-gradient(135deg, rgba(56,217,255,.18), rgba(76,125,255,.2));
      border-color: rgba(56,217,255,.22);
    }

    .section {
      margin-top: 24px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .section-link {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      background: none;
      padding: 4px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .quick-card {
      min-width: 0;
      min-height: 116px;
      padding: 17px;
      border-radius: 19px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(19,25,38,.95), rgba(12,17,27,.95));
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .quick-card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: -40px;
      bottom: -45px;
      border-radius: 50%;
      filter: blur(20px);
      opacity: .4;
    }

    .quick-card.mining::after { background: var(--cyan); }
    .quick-card.games::after { background: var(--purple); }
    .quick-card.earn::after { background: var(--green); }
    .quick-card.giveaways::after { background: var(--pink); }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.07);
    }

    .icon-box svg {
      width: 20px;
      height: 20px;
    }

    .quick-name {
      font-size: 14px;
      font-weight: 850;
    }

    .quick-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .progress-card {
      padding: 17px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(16,21,32,.78);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    .level {
      font-weight: 850;
    }

    .xp {
      color: var(--muted);
    }

    .progress {
      height: 8px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.07);
    }

    .progress > div {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--purple));
      transition: width .4s ease;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feed-item {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 12px;
      border-radius: 15px;
      background: rgba(16,21,32,.68);
      border: 1px solid rgba(255,255,255,.055);
    }

    .feed-avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, #202a3c, #111827);
      font-size: 13px;
      font-weight: 850;
    }

    .feed-text {
      min-width: 0;
      flex: 1;
    }

    .feed-name {
      font-size: 12px;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feed-desc {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .feed-amount {
      flex: 0 0 auto;
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
    }

    .demo-label {
      margin-top: 9px;
      color: #687285;
      font-size: 9px;
      text-align: center;
    }

    /* generic screens */

    .screen-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .screen-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
    }

    .panel {
      padding: 17px;
      margin-top: 14px;
      border-radius: 20px;
      background: rgba(16,21,32,.8);
      border: 1px solid var(--line);
    }

    .panel-title {
      font-size: 14px;
      font-weight: 850;
    }

    .panel-muted {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .mining-display {
      margin-top: 18px;
      padding: 26px 18px;
      text-align: center;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 0%, rgba(56,217,255,.11), transparent 45%),
        rgba(16,21,32,.82);
      border: 1px solid rgba(56,217,255,.12);
    }

    .mining-value {
      font-size: clamp(28px, 8vw, 43px);
      font-weight: 900;
      letter-spacing: -.04em;
      overflow-wrap: anywhere;
    }

    .mining-rate {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .main-action {
      width: 100%;
      min-height: 52px;
      margin-top: 14px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .025em;
      background: linear-gradient(135deg, #25c9ee, #536fff);
      box-shadow: 0 10px 28px rgba(56,125,255,.2);
    }

    .main-action.green {
      background: linear-gradient(135deg, #28d995, #39b9ce);
    }

    .main-action:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
    }

    .tab {
      min-height: 38px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .tab.active {
      color: #fff;
      background: rgba(255,255,255,.09);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 13px;
    }

    .list-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 14px;
      border-radius: 17px;
      background: rgba(16,21,32,.8);
      border: 1px solid var(--line);
    }

    .list-icon {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,.055);
    }

    .list-info {
      min-width: 0;
      flex: 1;
    }

    .list-name {
      font-size: 13px;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .list-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .list-right {
      flex: 0 0 auto;
      text-align: right;
    }

    .price {
      font-size: 12px;
      font-weight: 850;
    }

    .mini-btn {
      min-height: 34px;
      padding: 0 11px;
      margin-top: 6px;
      border-radius: 10px;
      background: rgba(56,217,255,.11);
      color: var(--cyan);
      border: 1px solid rgba(56,217,255,.13);
      font-size: 10px;
      font-weight: 850;
    }

    .game-grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      min-height: 160px;
      padding: 19px;
      border-radius: 21px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(19,25,39,.95), rgba(11,16,25,.95));
    }

    .game-card.flip {
      background:
        radial-gradient(circle at 100% 0%, rgba(155,108,255,.18), transparent 42%),
        linear-gradient(145deg, rgba(19,25,39,.95), rgba(11,16,25,.95));
    }

    .game-card.run {
      background:
        radial-gradient(circle at 100% 0%, rgba(56,217,255,.14), transparent 42%),
        linear-gradient(145deg, rgba(19,25,39,.95), rgba(11,16,25,.95));
    }

    .game-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
    }

    .game-name {
      margin-top: 17px;
      font-size: 16px;
      font-weight: 900;
    }

    .game-desc {
      margin-top: 4px;
      max-width: 75%;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .game-open {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
    }

    .earn-grid {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .ad-card {
      padding: 15px;
      border-radius: 18px;
      background: rgba(16,21,32,.82);
      border: 1px solid var(--line);
    }

    .ad-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .ad-name {
      font-size: 13px;
      font-weight: 850;
    }

    .ad-counter {
      color: var(--muted);
      font-size: 10px;
    }

    .ad-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    .reward {
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
    }

    .watch-btn {
      min-height: 37px;
      padding: 0 14px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(56,217,255,.16), rgba(76,125,255,.18));
      border: 1px solid rgba(56,217,255,.15);
      color: #fff;
      font-size: 11px;
      font-weight: 850;
    }

    .wallet-box {
      margin-top: 17px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(16,21,32,.82);
      border: 1px solid var(--line);
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .field {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;
      border-radius: 12px;
      outline: none;
      color: #fff;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
    }

    .field:focus {
      border-color: rgba(56,217,255,.35);
    }

    .field + .field {
      margin-top: 10px;
    }

    .swap-row {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      align-items: end;
      gap: 9px;
    }

    .swap-arrow {
      width: 48px;
      height: 46px;
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
    }

    .profile-menu {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .profile-item {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 14px;
      border-radius: 16px;
      text-align: left;
      background: rgba(16,21,32,.82);
      border: 1px solid var(--line);
    }

    .profile-item-icon {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.05);
    }

    .profile-item-text {
      min-width: 0;
      flex: 1;
      font-size: 12px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .profile-arrow {
      color: #657084;
    }

    .rank-tabs {
      margin-top: 18px;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 12px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 11px;
      border-radius: 14px;
      background: rgba(16,21,32,.75);
      border: 1px solid rgba(255,255,255,.05);
    }

    .rank-num {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .rank-user {
      min-width: 0;
      font-size: 11px;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-value {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 850;
    }

    .current-rank {
      margin-top: 10px;
      padding: 13px;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(56,217,255,.1), rgba(155,108,255,.1));
      border: 1px solid rgba(56,217,255,.13);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
    }

    .ref-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, rgba(155,108,255,.13), transparent 42%),
        rgba(16,21,32,.82);
      border: 1px solid var(--line);
    }

    .ref-link {
      margin-top: 10px;
      padding: 11px;
      border-radius: 11px;
      color: #b9c3d5;
      background: rgba(255,255,255,.04);
      font-size: 10px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ref-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .giveaway-list {
      display: grid;
      gap: 11px;
      margin-top: 17px;
    }

    .giveaway {
      padding: 17px;
      border-radius: 19px;
      background:
        linear-gradient(145deg, rgba(21,27,42,.94), rgba(12,17,26,.94));
      border: 1px solid var(--line);
    }

    .giveaway-prize {
      font-size: 16px;
      font-weight: 900;
    }

    .giveaway-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      margin-top: 13px;
    }

    .meta-box {
      min-width: 0;
      padding: 10px;
      border-radius: 11px;
      background: rgba(255,255,255,.04);
    }

    .meta-label {
      color: var(--muted);
      font-size: 9px;
    }

    .meta-value {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    /* bottom nav */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding:
        7px
        max(10px, env(safe-area-inset-left))
        calc(7px + var(--safe-bottom))
        max(10px, env(safe-area-inset-right));
      background: rgba(8,11,18,.91);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .nav-inner {
      width: min(100%, 620px);
      height: var(--nav-height);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
    }

    .nav-btn {
      min-width: 0;
      height: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      color: #626c7e;
      border-radius: 15px;
      font-size: 9px;
      font-weight: 750;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(255,255,255,.055);
    }

    .nav-btn.active svg {
      color: var(--cyan);
      filter: drop-shadow(0 0 7px rgba(56,217,255,.35));
    }

    /* modal */

    .modal-root {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .modal-root.show {
      display: flex;
    }

    .modal {
      width: min(100%, 680px);
      max-height: 92dvh;
      overflow-y: auto;
      padding: 12px 16px calc(18px + var(--safe-bottom));
      border-radius: 25px 25px 0 0;
      background:
        radial-gradient(circle at 100% 0%, rgba(155,108,255,.08), transparent 35%),
        #0d121c;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 -20px 70px rgba(0,0,0,.4);
      animation: modalIn .22s ease;
    }

    @keyframes modalIn {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      margin: 0 auto 17px;
      border-radius: 99px;
      background: rgba(255,255,255,.15);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .modal-title {
      min-width: 0;
      font-size: 18px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .close-btn {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: #9aa4b6;
    }

    .modal-body {
      min-width: 0;
    }

    /* combo */

    .combo-cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .combo-card {
      aspect-ratio: .78;
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(30,39,57,.95), rgba(14,19,29,.95));
      border: 1px solid rgba(255,255,255,.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 850;
    }

    .combo-card svg {
      width: 24px;
      height: 24px;
    }

    .combo-card.selected {
      border-color: var(--cyan);
      background: rgba(56,217,255,.1);
      box-shadow: 0 0 0 2px rgba(56,217,255,.08);
    }

    /* wheel */

    .wheel-wrap {
      display: grid;
      place-items: center;
      padding: 12px 0 17px;
    }

    .wheel {
      position: relative;
      width: min(74vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        conic-gradient(
          #36d7ff 0 45deg,
          #8d69ff 45deg 90deg,
          #f15cff 90deg 135deg,
          #45e29a 135deg 180deg,
          #ffd35c 180deg 225deg,
          #4c7dff 225deg 270deg,
          #35d6c5 270deg 315deg,
          #b26cff 315deg 360deg
        );
      border: 8px solid #161d2b;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
      transition: transform 3.7s cubic-bezier(.12,.74,.12,1);
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 31%;
      border-radius: 50%;
      background: #0d121c;
      border: 1px solid rgba(255,255,255,.1);
    }

    .wheel-center {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      pointer-events: none;
    }

    .wheel-pointer {
      position: absolute;
      z-index: 3;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 18px solid #fff;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
    }

    /* games */

    .game-modal {
      width: 100%;
      height: 100dvh;
      max-height: none;
      padding:
        max(10px, env(safe-area-inset-top))
        10px
        calc(10px + var(--safe-bottom));
      border-radius: 0;
      background: #070a10;
    }

    .game-modal .modal-handle {
      display: none;
    }

    .game-stage {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: calc(100dvh - 90px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 22px;
      background: #101722;
      border: 1px solid rgba(255,255,255,.08);
    }

    .game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .game-ui {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .game-stat {
      padding: 8px 11px;
      border-radius: 11px;
      background: rgba(0,0,0,.3);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 850;
    }

    .game-exit {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.1);
    }

    .game-help {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 99px;
      color: rgba(255,255,255,.7);
      background: rgba(0,0,0,.3);
      font-size: 10px;
      pointer-events: none;
    }

    /* toast */

    .toast {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
      transform: translate(-50%, 20px);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 11px 15px;
      border-radius: 12px;
      background: rgba(24,30,43,.96);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .empty {
      padding: 28px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (min-width: 600px) {
      .page {
        padding-left: 22px;
        padding-right: 22px;
      }

      .game-grid {
        grid-template-columns: 1fr 1fr;
      }

      .earn-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem("paid_zombie_state");
      if (!raw) return clone(DEFAULT_STATE);

      const saved = JSON.parse(raw);
      const base = clone(DEFAULT_STATE);

      return {
        ...base,
        ...saved,
        mining: {
          ...base.mining,
          ...(saved.mining || {})
        },
        boosts: {
          ...base.boosts,
          ...(saved.boosts || {})
        },
        ads: {
          ...base.ads,
          ...(saved.ads || {})
        },
        games: {
          ...base.games,
          ...(saved.games || {})
        }
      };
    } catch (_) {
      return clone(DEFAULT_STATE);
    }
  }

  let state = loadState();

  function saveState() {
    try {
      localStorage.setItem("paid_zombie_state", JSON.stringify(state));
    } catch (_) {}
  }

  /* =========================
     HELPERS
  ========================= */

  const $ = (selector, root = document) => root.querySelector(selector);

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function t(path, vars = {}) {
    const lang = I18N[state.language] || I18N.ru;
    const fallback = I18N.en;

    function get(obj, p) {
      return p.split(".").reduce((acc, key) => acc?.[key], obj);
    }

    let text = get(lang, path);

    if (text == null) {
      text = get(fallback, path);
    }

    if (text == null) {
      return path;
    }

    return String(text).replace(/\{(\w+)\}/g, (_, key) => {
      return vars[key] ?? "";
    });
  }

  function fmt(num, decimals = 4) {
    return Number(num || 0).toLocaleString("en-US", {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  function short(num) {
    return Number(num || 0).toLocaleString("en-US", {
      maximumFractionDigits: 2
    });
  }

  function random(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function toast(message) {
    const el = $("#toast");
    el.textContent = message;
    el.classList.add("show");

    clearTimeout(toast.timer);

    toast.timer = setTimeout(() => {
      el.classList.remove("show");
    }, 2200);
  }

  function setIcons() {
    document.querySelectorAll("[data-icon]").forEach(el => {
      el.innerHTML = icon(el.dataset.icon);
    });
  }

  function avatarHTML(sizeClass = "") {
    const first =
      tgUser.first_name ||
      tgUser.username ||
      "Z";

    const initials = escapeHTML(first.slice(0, 1).toUpperCase());

    if (tgUser.photo_url) {
      return `
        <div class="avatar ${sizeClass}">
          <img src="${escapeHTML(tgUser.photo_url)}" alt="">
        </div>
      `;
    }

    return `
      <div class="avatar ${sizeClass}">
        ${initials}
      </div>
    `;
  }

  function username() {
    if (tgUser.username) return "@" + tgUser.username;
    if (tgUser.first_name) return tgUser.first_name;
    return "Zombie";
  }

  function miningRate() {
    let rate = state.mining.baseRate;

    const miners = [
      1,
      1.7,
      2.8,
      4.4,
      6.5,
      9
    ];

    rate *= miners[state.miner] || 1;

    rate *= 1 + state.boosts.turbo * .25;
    rate *= 1 + state.boosts.reactor * .5;
    rate *= 1 + state.boosts.battery * .1;

    return rate;
  }

  function miningAccrued() {
    let amount = Number(state.mining.accumulated || 0);

    if (state.mining.active && state.mining.startedAt) {
      const seconds = Math.max(
        0,
        (Date.now() - state.mining.startedAt) / 1000
      );

      amount += seconds * miningRate();
    }

    return amount;
  }

  function addHistory(type, amount, currency = "ZMB") {
    state.history.unshift({
      type,
      amount,
      currency,
      time: Date.now()
    });

    state.history = state.history.slice(0, 30);
  }

  function addXP(amount) {
    state.xp += amount;

    while (state.xp >= 1000) {
      state.xp -= 1000;
      state.level++;
    }
  }

  function updateCountdowns() {
    document.querySelectorAll(".countdown").forEach(el => {
      const end = Number(el.dataset.end);
      const left = Math.max(0, end - Date.now());

      const h = Math.floor(left / 3600000);
      const m = Math.floor((left % 3600000) / 60000);
      const s = Math.floor((left % 60000) / 1000);

      el.textContent =
        `${String(h).padStart(2,"0")}:` +
        `${String(m).padStart(2,"0")}:` +
        `${String(s).padStart(2,"0")}`;
    });
  }

  /* =========================
     MINING
  ========================= */

  function startMiningTicker() {
    clearInterval(miningTimer);

    miningTimer = setInterval(() => {
      const el = $("#mining-live");

      if (!el) {
        clearInterval(miningTimer);
        return;
      }

      el.textContent = `${fmt(miningAccrued(), 7)} ZMB`;
    }, 250);
  }

  function startMining() {
    if (state.mining.active) return;

    state.mining.active = true;
    state.mining.startedAt = Date.now();

    saveState();
    toast(t("messages.miningStarted"));
    render();
    startMiningTicker();
  }

  function claimMining() {
    const amount = miningAccrued();

    if (amount <= 0) {
      toast(t("messages.nothing"));
      return;
    }

    state.balance += amount;
    state.mining.active = false;
    state.mining.startedAt = 0;
    state.mining.accumulated = 0;

    addXP(Math.min(50, Math.floor(amount * 10)));
    addHistory("Mining claim", amount, "ZMB");

    saveState();

    toast(`+${fmt(amount, 5)} ZMB`);
    render();
  }

  function buyMiner(id) {
    id = Number(id);

    if (id <= state.miner) return;

    const miner = MINERS[id];

    if (!miner) return;

    if (state.balance < miner.price) {
      toast(t("messages.insufficient"));
      return;
    }

    state.balance -= miner.price;
    state.miner = id;

    addHistory("Miner purchase", -miner.price, "ZMB");

    saveState();
    toast(t("messages.purchased"));
    render();
  }

  function buyBoost(id) {
    const boost = BOOSTS.find(x => x.id === id);

    if (!boost) return;

    if (state.balance < boost.price) {
      toast(t("messages.insufficient"));
      return;
    }

    if (!(id in state.boosts)) {
      state.boosts[id] = 0;
    }

    state.balance -= boost.price;
    state.boosts[id]++;

    addHistory("Boost purchase", -boost.price, "ZMB");

    saveState();
    toast(t("messages.purchased"));
    render();
  }

  function watchAd(network) {

  function openAdModal(network) {
    let seconds = 3;

    openModal(
      network === "network1"
        ? t("earn.network1")
        : t("earn.network2"),
      `
        <div class="panel" style="text-align:center">
          <div style="font-size:32px;font-weight:900" id="ad-countdown">
            3
          </div>

          <div class="panel-muted">
            ${t("earn.reward")}
          </div>
        </div>
      `,
      false
    );

    const timer = setInterval(() => {
      seconds--;

      const el = $("#ad-countdown");

      if (el) {
        el.textContent = seconds;
      }

      if (seconds <= 0) {
        clearInterval(timer);

        state.ads[network]++;
        state.balance += .5;

        const totalAds =
          state.ads.network1 +
          state.ads.network2;

        if (totalAds % 5 === 0) {
          state.tickets++;
          toast(t("messages.ticket"));
        } else {
          toast(t("messages.adFinished"));
        }

        addXP(3);
        addHistory("Ad reward", .5, "ZMB");

        saveState();
        closeModal();
        render();
      }
    }, 1000);
  }

  /* =========================
     WALLET
  ========================= */

  function walletTab(tab) {
    const content = $("#wallet-content");

    if (!content) return;

    document.querySelectorAll(".wallet-box .tab")
      .forEach(btn => {
        btn.classList.toggle(
          "active",
          btn.dataset.tab === tab
        );
      });

    content.innerHTML =
      tab === "swap"
        ? swapHTML()
        : withdrawHTML();
  }

  function swapDirection() {
    const from = $("#swap-from");
    const to = $("#swap-to");

    if (!from || !to) return;

    const old = from.value;
    from.value = to.value;
    to.value = old;
  }

  function doSwap() {
    const from = $("#swap-from")?.value;
    const to = $("#swap-to")?.value;
    const amount = Number($("#swap-amount")?.value || 0);

    if (!amount || amount <= 0 || from === to) return;

    if (from === "ZMB" && to === "TON") {
      if (state.balance < amount) {
        toast(t("messages.insufficient"));
        return;
      }

      const result = amount / 100;

      state.balance -= amount;
      state.ton += result;

      addHistory("Swap", -amount, "ZMB");
      addHistory("Swap", result, "TON");
    }

    if (from === "TON" && to === "ZMB") {
      if (state.ton < amount) {
        toast("Not enough TON");
        return;
      }

      const result = amount * 100;

      state.ton -= amount;
      state.balance += result;

      addHistory("Swap", -amount, "TON");
      addHistory("Swap", result, "ZMB");
    }

    saveState();
    toast(t("messages.swapDone"));
    render();
  }

  function withdraw() {
    const address = ($("#withdraw-address")?.value || "").trim();
    const amount = Number($("#withdraw-amount")?.value || 0);

    if (!address || amount < 1) {
      toast("Enter a valid amount and address");
      return;
    }

    const fee = .05;

    if (state.ton < amount + fee) {
      toast(t("messages.insufficient"));
      return;
    }

    state.ton -= amount + fee;

    addHistory("Withdrawal", -amount, "TON");
    addHistory("Fee", -fee, "TON");

    saveState();

    toast(t("messages.withdrawalDemo"));
    render();
  }

  /* =========================

  function comboTarget() {
    const params = new URLSearchParams(location.search);
    const value = params.get("combo");

    if (value) {
      const nums = value
        .split(",")
        .map(Number)
        .filter(x => x >= 1 && x <= 5);

      if (nums.length === 3) {
        return nums;
      }
    }

    return [2, 4, 5];
  }

  let comboSelected = [];

  function openCombo() {
    const remaining =
      86400000 - (Date.now() - state.comboLast);

    if (state.comboLast && remaining > 0) {

    comboSelected = [];

    openModal(
      t("modal.combo"),

  function comboSelect(card) {
    card = Number(card);

    if (comboSelected.includes(card)) {
      comboSelected = comboSelected.filter(x => x !== card);
    } else {
      if (comboSelected.length >= 3) return;
      comboSelected.push(card);
    }

    document.querySelectorAll(".combo-card").forEach(btn => {
      btn.classList.toggle(
        "selected",
        comboSelected.includes(Number(btn.dataset.card))
      );
    });

    const count = $("#combo-count");
    const confirm = $("#combo-confirm");

    if (count) count.textContent = `${comboSelected.length}/3`;
    if (confirm) confirm.disabled = comboSelected.length !== 3;
  }

  function confirmCombo() {
    if (comboSelected.length !== 3) {
      toast(t("messages.comboNeed"));
      return;
    }

    const target = comboTarget();

    const correct =
      [...comboSelected].sort().join(",") ===
      [...target].sort().join(",");

    state.comboLast = Date.now();

    if (correct) {
      state.balance += 10;
      addHistory("Daily Combo", 10, "ZMB");
      toast(t("messages.comboWin"));
    } else {
      toast(t("messages.comboLose"));
    }

    saveState();
    closeModal();

  /* =========================
     GAMES
  ========================= */

  let game = null;

  function openGame(type) {
    stopGame();

    const title =
      type === "flip"
        ? t("games.flip")
        : t("games.run");

    openModal(
      title,
      `
        <div class="game-stage">
          <canvas id="game-canvas" class="game-canvas"></canvas>

          <div class="game-ui">
            <div class="game-stat" id="game-score">0</div>
            <div class="game-stat" id="game-earned">0 ZMB</div>
          </div>

          <button class="game-exit"
                  data-action="closeGame">
            ${icon("close")}
          </button>

          <div class="game-help">
            ${type === "flip" ? "TAP / SPACE" : "TAP / SPACE / ↑"}
          </div>
        </div>
      `,
      false,
      true
    );

    setTimeout(() => {
      const canvas = $("#game-canvas");
      if (!canvas) return;

      if (type === "flip") startFlip(canvas);
      else startRun(canvas);
    }, 30);
  }

  function setupCanvas(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));

    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return {
      ctx,
      width: rect.width,
      height: rect.height
    };
  }

  function sound(freq = 440, duration = .06) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      const ac = new AC();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.frequency.value = freq;
      osc.type = "sine";

      gain.gain.setValueAtTime(.045, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        .001,
        ac.currentTime + duration
      );

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + duration);
    } catch (_) {}
  }

  function drawZombie(ctx, x, y, scale, velocity, time, running = false) {
    ctx.save();
    ctx.translate(x, y);

    const tilt = Math.max(-.35, Math.min(.55, velocity / 900));
    ctx.rotate(tilt);

    const bob =
      running
        ? Math.sin(time * .018) * 2.5
        : Math.sin(time * .012) * 1.5;

    ctx.translate(0, bob);

    /* shadow */
    ctx.globalAlpha = .18;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, 29 * scale, 22 * scale, 5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* legs */
    const legPhase =
      running
        ? Math.sin(time * .025) * 8
        : Math.sin(time * .01) * 2;

    ctx.strokeStyle = "#5fdbb1";
    ctx.lineWidth = 5 * scale;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(-7 * scale, 15 * scale);
    ctx.lineTo((-12 + legPhase) * scale, 31 * scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(7 * scale, 15 * scale);
    ctx.lineTo((12 - legPhase) * scale, 31 * scale);
    ctx.stroke();

    /* body */
    ctx.fillStyle = "#48d39f";
    ctx.beginPath();
    ctx.roundRect(
      -15 * scale,
      -12 * scale,
      30 * scale,
      31 * scale,
      9 * scale
    );
    ctx.fill();

    /* arms */
    const armPhase =
      running
        ? Math.sin(time * .025) * 10
        : 0;

    ctx.strokeStyle = "#55e3ad";
    ctx.lineWidth = 5 * scale;

    ctx.beginPath();
    ctx.moveTo(-12 * scale, -3 * scale);
    ctx.lineTo((-23 - armPhase) * scale, 7 * scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(12 * scale, -3 * scale);
    ctx.lineTo((23 + armPhase) * scale, 7 * scale);
    ctx.stroke();

    /* head */
    ctx.fillStyle = "#63e5b3";
    ctx.beginPath();
    ctx.arc(0, -23 * scale, 15 * scale, 0, Math.PI * 2);
    ctx.fill();

    /* hair */
    ctx.fillStyle = "#1d7e62";

    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 8 * scale, -35 * scale);
      ctx.lineTo((i * 8 - 4) * scale, -45 * scale);
      ctx.lineTo((i * 8 + 5) * scale, -36 * scale);
      ctx.fill();
    }

    /* eyes */
    ctx.fillStyle = "#0a1017";

    ctx.beginPath();
    ctx.arc(-5 * scale, -24 * scale, 2.2 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(5 * scale, -24 * scale, 2.2 * scale, 0, Math.PI * 2);
    ctx.fill();

    /* mouth */
    ctx.strokeStyle = "#174f40";
    ctx.lineWidth = 2 * scale;

    ctx.beginPath();
    ctx.arc(0, -18 * scale, 6 * scale, 0, Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  function startFlip(canvas) {
    const { ctx, width, height } = setupCanvas(canvas);

    game = {
      type: "flip",
      running: true,
      last: performance.now(),
      score: 0,
      earned: 0,
      y: height * .45,
      vy: 0,
      pipes: [],
      spawn: 0,
      time: 0,
      width,
      height,
      ctx,
      raf: 0
    };

    gameFlipLoop(performance.now());
  }

  function flap() {
    if (!game || game.type !== "flip") return;

    if (!game.running) {
      restartCurrentGame();
      return;
    }

    game.vy = -430;
    sound(650, .06);
  }

  function gameFlipLoop(now) {
    if (!game || game.type !== "flip") return;

    const dt = Math.min(.032, (now - game.last) / 1000);
    game.last = now;
    game.time += dt * 1000;

    const g = game;

    g.vy += 1150 * dt;
    g.y += g.vy * dt;

    g.spawn -= dt;

    if (g.spawn <= 0) {
      const gap = 150;
      const minTop = 70;
      const maxTop = g.height - gap - 100;

      const top = minTop + Math.random() * (maxTop - minTop);

      g.pipes.push({
        x: g.width + 40,
        top,
        gap,
        passed: false
      });

      g.spawn = 1.55;
    }

    for (const p of g.pipes) {
      p.x -= 185 * dt;

      if (!p.passed && p.x + 55 < 82) {
        p.passed = true;
        g.score++;
        g.earned += .08;
        updateGameUI();
      }
    }

    g.pipes = g.pipes.filter(p => p.x > -90);

    if (
      g.y < 25 ||
      g.y > g.height - 25 ||
      g.pipes.some(p =>
        82 + 18 > p.x &&
        82 - 18 < p.x + 55 &&
        (g.y - 18 < p.top ||
         g.y + 18 > p.top + p.gap)
      )
    ) {
      gameOver();
      return;
    }

    drawFlip(g);

    g.raf = requestAnimationFrame(gameFlipLoop);
  }

  function drawFlip(g) {
    const { ctx, width, height } = g;

    const bg = ctx.createLinearGradient(0,0,0,height);
    bg.addColorStop(0, "#172a45");
    bg.addColorStop(1, "#0a1019");

    ctx.fillStyle = bg;
    ctx.fillRect(0,0,width,height);

    /* background circles */
    ctx.globalAlpha = .12;
    ctx.fillStyle = "#43d9ff";

    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(
        (i * 160 + 50) % width,
        90 + i * 90,
        35 + i * 8,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    ctx.globalAlpha = 1;

    /* pipes */
    for (const p of g.pipes) {
      ctx.fillStyle = "#4bd3a0";

      ctx.fillRect(p.x, 0, 55, p.top);
      ctx.fillRect(
        p.x,
        p.top + p.gap,
        55,
        height - p.top - p.gap
      );

      ctx.fillStyle = "#66e8b8";
      ctx.fillRect(p.x - 4, p.top - 12, 63, 12);
      ctx.fillRect(
        p.x - 4,
        p.top + p.gap,
        63,
        12
      );
    }

    /* ground */
    ctx.fillStyle = "#0b1119";
    ctx.fillRect(0, height - 14, width, 14);

    drawZombie(
      ctx,
      82,
      g.y,
      .85,
      g.vy,
      g.time,
      false
    );
  }

  function startRun(canvas) {
    const { ctx, width, height } = setupCanvas(canvas);

    game = {
      type: "run",
      running: true,
      last: performance.now(),
      score: 0,
      earned: 0,
      x: 80,
      y: height - 75,
      vy: 0,
      obstacles: [],
      coins: [],
      spawn: .7,
      coinSpawn: .8,
      speed: 300,
      time: 0,
      width,
      height,
      ctx,
      raf: 0,
      grounded: true
    };

    gameRunLoop(performance.now());
  }

  function jump() {
    if (!game || game.type !== "run") return;

    if (!game.running) {
      restartCurrentGame();
      return;
    }

    if (!game.grounded) return;

    game.vy = -730;
    game.grounded = false;
    sound(520, .07);
  }

  function gameRunLoop(now) {
    if (!game || game.type !== "run") return;

    const dt = Math.min(.032, (now - game.last) / 1000);
    game.last = now;
    game.time += dt * 1000;

    const g = game;

    g.speed += dt * 5;

    g.vy += 1850 * dt;
    g.y += g.vy * dt;

    const ground = g.height - 75;

    if (g.y >= ground) {
      g.y = ground;
      g.vy = 0;
      g.grounded = true;
    }

    g.spawn -= dt;
    g.coinSpawn -= dt;

    if (g.spawn <= 0) {
      const heights = [34, 46, 62, 75];
      const h = heights[random(0, heights.length - 1)];

      g.obstacles.push({
        x: g.width + 30,
        width: random(22, 42),
        height: h
      });

      g.spawn = .9 + Math.random() * .8;
    }

    if (g.coinSpawn <= 0) {
      g.coins.push({
        x: g.width + 20,
        y: ground - random(45, 155),
        r: 7,
        collected: false
      });

      g.coinSpawn = .55 + Math.random() * .8;
    }

    for (const o of g.obstacles) {
      o.x -= g.speed * dt;
    }

    for (const c of g.coins) {
      c.x -= g.speed * dt;
    }

    g.obstacles = g.obstacles.filter(o => o.x > -70);
    g.coins = g.coins.filter(c => c.x > -30 && !c.collected);

    for (const o of g.obstacles) {
      const zx = g.x;
      const zy = g.y;

      const hit =
        zx + 15 > o.x &&
        zx - 15 < o.x + o.width &&
        zy + 15 > ground - o.height &&
        zy - 20 < ground;

      if (hit) {
        gameOver();
        return;
      }
    }

    for (const c of g.coins) {
      const dx = c.x - g.x;
      const dy = c.y - (g.y - 5);

      if (Math.sqrt(dx*dx + dy*dy) < 28) {
        c.collected = true;
        g.score++;
        g.earned += .12;
        sound(880, .045);
        updateGameUI();
      }
    }

    if (Math.floor(g.time / 1000) % 2 === 0) {
      g.score += 0.002;
    }

    drawRun(g);

    g.raf = requestAnimationFrame(gameRunLoop);
  }

  function drawRun(g) {
    const { ctx, width, height } = g;

    const bg = ctx.createLinearGradient(0,0,0,height);
    bg.addColorStop(0, "#12243a");
    bg.addColorStop(1, "#090e16");

    ctx.fillStyle = bg;
    ctx.fillRect(0,0,width,height);

    /* distant shapes */
    ctx.fillStyle = "rgba(56,217,255,.06)";

    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.arc(
        i * 120 + 20,
        100 + (i % 3) * 55,
        35,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    /* ground */
    ctx.fillStyle = "#111a26";
    ctx.fillRect(0, g.height - 60, width, 60);

    ctx.strokeStyle = "rgba(255,255,255,.07)";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, g.height - 60);
    ctx.lineTo(width, g.height - 60);
    ctx.stroke();

    /* obstacles */
    for (const o of g.obstacles) {
      ctx.fillStyle = "#9a6bff";

      ctx.beginPath();
      ctx.roundRect(
        o.x,
        g.height - 60 - o.height,
        o.width,
        o.height,
        5
      );
      ctx.fill();

      ctx.fillStyle = "#bd9cff";

      ctx.beginPath();
      ctx.moveTo(o.x + o.width/2, g.height - 60 - o.height);
      ctx.lineTo(o.x + o.width/2 + 8, g.height - 60 - o.height - 13);
      ctx.lineTo(o.x + o.width/2 - 8, g.height - 60 - o.height - 13);
      ctx.closePath();
      ctx.fill();
    }

    /* coins */
    for (const c of g.coins) {
      ctx.fillStyle = "#ffd45a";

      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#fff1a3";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r - 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    drawZombie(
      ctx,
      g.x,
      g.y,
      .92,
      g.vy,
      g.time,
      true
    );
  }

  function updateGameUI() {
    if (!game) return;

    const score = $("#game-score");
    const earned = $("#game-earned");

    if (score) {
      score.textContent =
        Math.floor(game.score);
    }

    if (earned) {
      earned.textContent =
        `${fmt(game.earned, 2)} ZMB`;
    }
  }

  function gameOver() {
    if (!game) return;

    game.running = false;

    if (game.type === "flip") {
      state.games.flipBest =
        Math.max(
          state.games.flipBest,
          Math.floor(game.score)
        );
    }

    if (game.type === "run") {
      state.games.runBest =
        Math.max(
          state.games.runBest,
          Math.floor(game.score)
        );
    }

    state.games.totalZmb += game.earned;

    if (game.earned > 0) {
      state.balance += game.earned;
      addHistory("Game reward", game.earned, "ZMB");
    }

    saveState();

    drawGameOver();
  }

  function drawGameOver() {
    if (!game) return;

    const { ctx, width, height } = game;

    ctx.fillStyle = "rgba(4,7,11,.58)";
    ctx.fillRect(0,0,width,height);

    ctx.textAlign = "center";

    ctx.fillStyle = "#fff";
    ctx.font = "900 28px Inter, Arial";
    ctx.fillText(
      "GAME OVER",
      width / 2,
      height / 2 - 20
    );

    ctx.fillStyle = "#9da8ba";
    ctx.font = "600 13px Inter, Arial";
    ctx.fillText(
      `${Math.floor(game.score)}  •  +${fmt(game.earned,2)} ZMB`,
      width / 2,
      height / 2 + 10
    );

    ctx.fillStyle = "#fff";
    ctx.font = "800 12px Inter, Arial";
    ctx.fillText(
      "TAP TO RESTART",
      width / 2,
      height / 2 + 45
    );
  }

  function restartCurrentGame() {
    if (!game) return;

    const type = game.type;
    const canvas = $("#game-canvas");

    if (!canvas) return;

    stopGame();

    if (type === "flip") startFlip(canvas);
    else startRun(canvas);
  }

  function stopGame() {
    if (game?.raf) {
      cancelAnimationFrame(game.raf);
    }

    game = null;
  }

  /* =========================
     MODALS
  ========================= */

  function openModal(title, body, close = true, fullscreen = false) {
    const root = $("#modal-root");
    const modal = $("#modal");

    modal.className =
      "modal" + (fullscreen ? " game-modal" : "");

    modal.innerHTML = `
      ${fullscreen ? "" : `<div class="modal-handle"></div>`}

      <div class="modal-head">
        <div class="modal-title">${escapeHTML(title)}</div>

        ${
          close
            ? `<button class="close-btn" data-action="closeModal">
                 ${icon("close")}
               </button>`
            : ""
        }
      </div>

      <div class="modal-body">
        ${body}
      </div>
    `;

    root.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    stopGame();

    $("#modal-root").classList.remove("show");
    document.body.style.overflow = "";

    const modal = $("#modal");
    modal.innerHTML = "";
  }

  /* =========================
     EVENT DELEGATION
  ========================= */

  document.addEventListener("click", e => {
    const target = e.target.closest("[data-action]");

    if (!target) return;

    const action = target.dataset.action;

    switch (action) {
      case "nav":
        showScreen(target.dataset.screen);
        break;

      case "startMining":
        startMining();
        break;

      case "claimMining":
        claimMining();
        break;

      case "miningTab": {
        const tab = target.dataset.tab;
        const parent = target.closest(".section");

        parent?.querySelectorAll(".tab").forEach(btn => {
          btn.classList.toggle(
            "active",
            btn.dataset.tab === tab
          );
        });

        const products = $("#mining-products");

        if (products) {
          products.innerHTML =
            tab === "miners"
              ? minersHTML()
              : boostsHTML();
        }

        break;
      }

      case "buyMiner":
        buyMiner(target.dataset.id);
        break;

      case "buyBoost":
        buyBoost(target.dataset.id);
        break;

      case "openGame":
        openGame(target.dataset.game);
        break;

      case "closeGame":
        closeModal();
        break;

      case "watchAd":
        watchAd(target.dataset.network);
        break;

      case "task":
        completeTask(target.dataset.task);
        break;

      case "earnTab": {
        const tab = target.dataset.tab;

        document.querySelectorAll(".tabs .tab")
          .forEach(btn => {
            if (
              btn.dataset.action === "earnTab"
            ) {
              btn.classList.toggle(
                "active",
                btn.dataset.tab === tab
              );
            }
          });

        const content = $("#earn-content");

        if (content) {
          content.innerHTML =
            tab === "ads"
              ? adsHTML()
              : `
                <div class="panel" style="margin-top:14px">
                  <div class="panel-title">
                    ${t("earn.promote")}
                  </div>

                  <div class="panel-muted">
                    Promote your Telegram channel or project.
                  </div>

                  <input class="field"
                         style="margin-top:14px"
                         placeholder="https://t.me/...">

                  <select class="field" style="margin-top:10px">
                    <option>10 TON</option>
                    <option>25 TON</option>
                    <option>50 TON</option>
                  </select>

                  <button class="main-action">
                    ${t("earn.promote")}
                  </button>

                  <div class="demo-label">
                    Demo payment interface
                  </div>
                </div>
              `;
        }

        break;
      }

      case "walletTab":
        walletTab(target.dataset.tab);
        break;

      case "swapDirection":
        swapDirection();
        break;

      case "swap":
        doSwap();
        break;

      case "withdraw":
        withdraw();
        break;

      case "openProfileItem":
        openProfileItem(target.dataset.item);
        break;

      case "language":
        setLanguage(target.dataset.language);
        break;

      case "rankTab": {
        const tab = target.dataset.tab;

        document.querySelectorAll(".rank-tabs .tab")
          .forEach(btn => {
            btn.classList.toggle(
              "active",
              btn.dataset.tab === tab
            );
          });

        const content = $("#rank-content");

        if (content) {
          content.innerHTML = rankingHTML(tab);
        }

        break;
      }

      case "copyReferral":
        copyText(target.dataset.link);
        break;

      case "shareReferral":
        shareReferral(target.dataset.link);
        break;

      case "participate":
        participate();
        break;

      case "openWheel":
        closeModal();
        setTimeout(openWheel, 80);
        break;

      case "spinWheel":
        spinWheel();
        break;

      case "openCombo":
        closeModal();
        setTimeout(openCombo, 80);
        break;

      case "comboSelect":
        comboSelect(target.dataset.card);
        break;

      case "confirmCombo":
        confirmCombo();
        break;

      case "closeModal":
        closeModal();
        break;
    }
  });

  /* =========================
     GAME INPUT
  ========================= */

  document.addEventListener("keydown", e => {
    if (!game) return;

    if (
      e.code === "Space" ||
      e.code === "ArrowUp"
    ) {
      e.preventDefault();

      if (game.type === "flip") flap();
      else jump();
    }
  });

  document.addEventListener("pointerdown", e => {
    if (!game) return;

    const canvas = $("#game-canvas");

    if (!canvas || e.target !== canvas) return;

    if (game.type === "flip") flap();
    else jump();
  });

  /* =========================
     REFERRALS
  ========================= */

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast(t("messages.copied"));
    } catch (_) {
      const input = document.createElement("textarea");
      input.value = text;
      document.body.appendChild(input);
      input.select();

      try {
        document.execCommand("copy");
      } catch (_) {}

      input.remove();

      toast(t("messages.copied"));
    }
  }

  function shareReferral(link) {
    const text =
      state.language === "ru"
        ? "Заходи в PAID ZOMBIE 👇"
        : state.language === "uk"
          ? "Заходь у PAID ZOMBIE 👇"
          : "Join PAID ZOMBIE 👇";

    const url =
      `https://t.me/share/url?url=${encodeURIComponent(link)}` +
      `&text=${encodeURIComponent(text)}`;

    if (tg?.openTelegramLink) {
      tg.openTelegramLink(url);
    } else {
      window.open(url, "_blank");
    }
  }

  /* =========================
     GIVEAWAYS
  ========================= */

  function participate() {
    if (state.tickets <= 0) {
      toast(t("messages.noTickets"));
      return;
    }

    state.tickets--;

    saveState();

    toast("✓");
    render();
  }

  /* =========================
     PAYOUT FEED
  ========================= */

  function schedulePayout() {
    clearTimeout(payoutTimer);

    payoutTimer = setTimeout(() => {
      const names = [
        "ZombieFox",
        "DeadPixel",
        "TONWalker",
        "NightMiner",
        "CryptoSoul",
        "MutantX",
        "PixelLord"
      ];

      const amount = random(40, 1500);

      payouts.unshift([
        names[random(0, names.length - 1)],
        `${amount.toLocaleString("en-US")} ZMB`
      ]);

      payouts = payouts.slice(0, 5);

      if (currentScreen === "home") {
        render();
      }

      schedulePayout();
    }, random(3000, 10000));
  }

  /* =========================
     TIMER
  ========================= */

  setInterval(updateCountdowns, 1000);

  /* =========================
     INIT
  ========================= */

  document.documentElement.lang = state.language;

  render();
  schedulePayout();

})();
</script>
</body>
</html>
